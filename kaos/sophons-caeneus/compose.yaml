# docs.siderolabs.com/talos/v1.11/platform-specific-installations/local-platforms/docker#docker
# docker run --rm -it
#   --name tutorial
#   --hostname talos-cp
#   --read-only
#   --privileged
#   --security-opt seccomp=unconfined
#   --mount type=tmpfs,destination=/run
#   --mount type=tmpfs,destination=/system
#   --mount type=tmpfs,destination=/tmp
#   --mount type=volume,destination=/system/state
#   --mount type=volume,destination=/var
#   --mount type=volume,destination=/etc/cni
#   --mount type=volume,destination=/etc/kubernetes
#   --mount type=volume,destination=/usr/libexec/kubernetes
#   --mount type=volume,destination=/opt
#   -e PLATFORM=container
#   ghcr.io/siderolabs/talos:v1.11.5

services:
  talos:
    restart: always
    stop_grace_period: 15m
    image: ghcr.io/siderolabs/talos:${TALOS_VERSION}
    privileged: true
    sysctls:
      net.ipv4.ip_forward: 1
      net.ipv6.conf.all.disable_ipv6: 0
      net.ipv6.conf.all.forwarding: 1
    security_opt:
      - seccomp=unconfined
    cpus: 6
    mem_limit: 12G
    read_only: true
    tmpfs:
      - /run
      - /system
      - /tmp
    volumes:
      - system-state:/system/state
      - var:/var
      - etc-cni:/etc/cni
      - etc-kubernetes:/etc/kubernetes
      - usr-libexec-kubernetes:/usr/libexec/kubernetes
      - opt:/opt
      - ./bin:/usr/local/lib/kubelet/credentialproviders:ro
      - /dev/dri/by-path:/dev/dri/by-path
      - /run/media/vrtx/big-boi/backups/backups/garage:/var/lib/garage/backup/big-boi
      - /run/media/vrtx/less-big-boi/backups/garage:/var/lib/garage/backup/less-big-boi
      - /run/media/vrtx/big-boi/time-machine:/mnt/big-boi/time-machine
      - /run/media/vrtx/big-boi/everything-else:/mnt/big-boi/everything-else
      - /run/media/vrtx/less-big-boi/media:/mnt/less-big-boi/media
      # - /run/media/vrtx/big-boi/backups/backups/garage:/var/mnt/garage-backup-big-boi
      # - /run/media/vrtx/less-big-boi/backups/garage:/var/mnt/garage-backup-less-big-boi
      - /run/media/vrtx/big-boi/time-machine:/var/mnt/big-boi-time-machine
      # - /run/media/vrtx/big-boi/everything-else:/var/mnt/big-boi-everything-else
      # - /run/media/vrtx/less-big-boi/media:/var/mnt/less-big-boi-media
    environment:
      - PLATFORM=container
    devices:
      - /dev/dri
      - /dev/kfd
      - /dev/net/tun
    networks:
      lab:
        ipv4_address: 10.42.42.5

volumes:
  tailscale-state:
  system-state:
  var:
  etc-cni:
  etc-kubernetes:
  usr-libexec-kubernetes:
  opt:

networks:
  lab:
    driver: ipvlan
    driver_opts:
      parent: lab1
    ipam:
      config:
        - subnet: 10.42.0.0/16

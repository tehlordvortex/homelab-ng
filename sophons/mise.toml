[env]
'_'.file = ["{{config_root}}/.env"]

[tasks.gen]
outputs = ["generated/*.yaml"]
sources = ["patches/*.yaml", "secrets.yaml", "gen.sh", ".env"]
dir = "{{config_root}}/talos"
run = "./gen.sh"

[tasks.'gen:node-lrps']
dir = "./apps/traefik/node-lrps"
run = "./gen.sh"

[tasks.'talos:all']
dir = "{{cwd}}"
run = ["talosctl --nodes=$SOPHONS_NODES"]

[tasks.'talos:controlplane']
dir = "{{cwd}}"
run = ["talosctl --nodes=$SOPHONS_CONTROLPLANE_NODES"]

[tasks.'talos:worker']
dir = "{{cwd}}"
run = ["talosctl --nodes=$SOPHONS_WORKER_NODES"]

[tasks.'talos:beta']
dir = "{{cwd}}"
run = ["talosctl --nodes=$SOPHONS_BETA"]

[tasks.'talos:theta']
dir = "{{cwd}}"
run = ["talosctl --nodes=$SOPHONS_THETA"]

[tasks.'talos:voltzahl']
dir = "{{cwd}}"
run = ["talosctl --nodes=$SOPHONS_VOLTZAHL"]

[tasks.'talos:leistung']
dir = "{{cwd}}"
run = ["talosctl --nodes=$SOPHONS_LEISTUNG"]

[tasks.'talos:alpha']
dir = "{{cwd}}"
run = ["talosctl --nodes=$SOPHONS_ALPHA"]

[tasks.'talos:prime']
dir = "{{cwd}}"
run = ["talosctl --nodes=$SOPHONS_PRIME"]

[tasks.'talos:caeneus']
dir = "{{cwd}}"
run = ["talosctl --nodes=$SOPHONS_CAENEUS"]

[tasks.'apply:beta']
depends = ["gen"]
dir = "{{config_root}}/talos"
run = ["mise talos:beta apply-config -f generated/controlplane.beta.yaml"]

[tasks.'apply:theta']
depends = ["gen"]
dir = "{{config_root}}/talos"
run = ["mise talos:theta apply-config -f generated/controlplane.theta.yaml"]

[tasks.'apply:voltzahl']
depends = ["gen"]
dir = "{{config_root}}/talos"
run = [
  "mise talos:voltzahl apply-config -f generated/controlplane.voltzahl.yaml",
]

[tasks.'apply:leistung']
depends = ["gen"]
dir = "{{config_root}}/talos"
run = ["mise talos:leistung apply-config -f generated/worker.leistung.yaml"]

[tasks.'apply:prime']
depends = ["gen"]
dir = "{{config_root}}/talos"
run = ["mise talos:prime apply-config -f generated/worker.prime.yaml"]

[tasks.'apply:caeneus']
depends = ["gen"]
dir = "{{config_root}}/talos"
run = ["mise talos:caeneus apply-config -f generated/worker.caeneus.yaml"]

[tasks.'apply:alpha']
depends = ["gen"]
dir = "{{config_root}}/talos"
run = ["mise talos:alpha apply-config -f generated/worker.alpha.yaml"]

[tasks.'upgrade']
# IMPORTANT: https://longhorn.io/docs/1.9.0/advanced-resources/os-distro-specific/talos-linux-support/#talos-linux-upgrades
run = "talosctl upgrade --preserve"

[tasks.'destructive:reset']
run = "talosctl reset --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL"

[tasks.'apply:all']
depends = ["gen"]
dir = "{{config_root}}/talos"
run = [{ task = "apply:worker" }, { task = "apply:controlplane" }]

[tasks.'apply:controlplane']
depends = ["gen"]
dir = "{{config_root}}/talos"
run = [
  { task = "apply:beta" },
  { task = "apply:theta" },
  { task = "apply:voltzahl" },
]

[tasks.'apply:worker']
depends = ["gen"]
dir = "{{config_root}}/talos"
run = [
  { task = "apply:alpha" },
  { task = "apply:prime" },
  { task = "apply:caeneus" },
  { task = "apply:leistung" },
]

[tasks.'helm:kustomized']
run = "kustokelm"

    app.kubernetes.io/name: garage
    cluster.garage.sophons.cloud: backup
spec:
  ports:
    - name: s3-api
      protocol: TCP
      port: 3900
      targetPort: 3900
    - name: s3-web
      protocol: TCP
      port: 3902
      targetPort: 3902
    - name: admin
      protocol: TCP
      port: 3903
      targetPort: 3903
  selector:
    app.kubernetes.io/instance: backup
    app.kubernetes.io/name: garage
  ipFamilies:
    - IPv4
    - IPv6
  ipFamilyPolicy: PreferDualStack

namespace: garage
resources:
  - resources.yaml # generated by kustomizer

patches:
  - patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: global-gateway-garage
      spec:
        template:
          spec:
            topologySpreadConstraints:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: garage
                    app.kubernetes.io/instance: global-gateway
                maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule

            volumes:
              - name: configmap
                configMap:
                  name: global-garage-config

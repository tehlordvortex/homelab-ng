commonLabels:
  cluster.garage.sophons.cloud: global

environment:
  - name: RUST_LOG
    value: warn

garage:
  noClusterRole: true
  kubernetesSkipCrd: true

  existingRpcSecret: garage
  existingConfigMap: global-garage-config

persistence:
  enabled: true
  meta:
    storageClass: local-path
  data:
    storageClass: local-path

extraVolumes:
  - name: traefik-config
    configMap:
      name: traefik-garage-config

image:
  repository: dxflrs/garage

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 800Mi

priorityClassName: system-node-critical

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false

deployment:
  kind: StatefulSet
  replicaCount: 4

tolerations:
  - key: prime.sophons.cloud
    operator: Exists
  - key: caeneus.sophons.cloud
    operator: Exists

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: garage
            app.kubernetes.io/instance: global-gateway
        mismatchLabelKeys: [controller-revision-hash]
        topologyKey: kubernetes.io/hostname
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: garage
            app.kubernetes.io/instance: global
        topologyKey: kubernetes.io/hostname

monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

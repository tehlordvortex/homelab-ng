apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cache
  namespace: garage
spec:
  plugin:
    souin:
      default_cache:
        regex:
          exclude: "/api/.+$"
        headers:
          - Authorization
          - Content-Type
        ttl: 15m
        default_cache_control: public, max-age=86400, must-revalidate
      log_level: debug
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-authelia
  namespace: garage
spec:
  chain:
    middlewares:
      - name: forwardauth-authelia
        namespace: authelia

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cache
  namespace: garage
spec:
  plugin:
    souin:
      default_cache:
        headers:
          - Authorization
          - Content-Type
        ttl: 5m
        default_cache_control: public, max-age=86400, must-revalidate
      log_level: debug
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: forwardauth-authelia
  namespace: garage
spec:
  forwardAuth:
    address: "http://authelia.authelia.svc.cluster.local/api/authz/forward-auth"
    trustForwardHeader: true
    authResponseHeaders:
      - "Remote-User"
      - "Remote-Name"
      - "Remote-Email"
      - "Remote-Groups"

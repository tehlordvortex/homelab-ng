commonLabels:
  cluster.garage.sophons.cloud: global

environment:
  - name: RUST_LOG
    value: warn

garage:
  noClusterRole: true

  blockSize: "2097152" # 2MiB
  compressionLevel: "3"
  metadataAutoSnapshotInterval: "1h"
  existingRpcSecret: garage
  s3:
    api:
      region: global
      bindAddr: "[::]:4900"
    web:
      bindAddr: "[::]:4902"

  additionalTopLevelConfig: |
    block_ram_buffer_max = "768MiB"
    block_max_concurrent_reads = 48
    block_max_concurrent_writes_per_request = 24

persistence:
  meta:
    storageClass: local-path
    size: 1Ti # ignored
  data:
    storageClass: local-path
    size: 1Ti # ignored

extraVolumes:
  - name: traefik-config
    configMap:
      name: traefik-garage-config

image:
  repository: docker.io/dxflrs/garage

resources:
  requests:
    cpu: 75m
    memory: 128Mi
  limits:
    memory: 800Mi

nodeSelector:
  hugeloads.sophons.cloud/garage: "true"
  cluster.garage.sophons.cloud/global: "true"

deployment:
  kind: StatefulSet
  replicaCount: 3


commonLabels:
  cluster.garage.sophons.cloud: global

garage:
  blockSize: "2097152" # 2MiB
  compressionLevel: "3"
  metadataAutoSnapshotInterval: "1h"
  existingRpcSecret: garage
  s3:
    api:
      region: global

persistence:
  meta:
    storageClass: local-path
    size: 1Ti # ignored
  data:
    storageClass: local-path
    size: 1Ti # ignored

image:
  repository: dxflrs/garage

resources:
  requests:
    cpu: 250m
    memory: 128Mi
  limits:
    memory: 768Mi

nodeSelector:
  hugeloads.sophons.cloud/garage: "true"
  cluster.garage.sophons.cloud/global: "true"

tolerations:
  - key: orunmila.sophons.cloud/ase-orun
    operator: Exists
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: garage
            app.kubernetes.io/instance: global
            cluster.garage.sophons.cloud: global
        mismatchLabelKeys: [pod-template-hash]
        topologyKey: topology.kubernetes.io/zone

priorityClassName: system-cluster-critical

securityContext:
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault

monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

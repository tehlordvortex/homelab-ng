priorityClassName: system-node-critical

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false

monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

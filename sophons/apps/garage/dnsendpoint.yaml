apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: s3-global
  namespace: garage
spec:
  endpoints:
    - dnsName: s3-global.sophons.cloud
      recordType: CNAME
      targets:
        - 163f32fb-e910-4a18-9ef0-9c5bfe635f33.cfargotunnel.com
    - dnsName: s3-global.sphns.run
      recordType: CNAME
      targets:
        - 163f32fb-e910-4a18-9ef0-9c5bfe635f33.cfargotunnel.com
    - dnsName: ps3-global.sphns.run
      recordType: A
      targets:
        - 10.43.0.69
      providerSpecific:
        - name: "external-dns.alpha.kubernetes.io/cloudflare-proxied"
          value: "false"
    - dnsName: ps3-global.sphns.run
      recordType: AAAA
      targets:
        - 2001:cafe:43::69
      providerSpecific:
        - name: "external-dns.alpha.kubernetes.io/cloudflare-proxied"
          value: "false"
---

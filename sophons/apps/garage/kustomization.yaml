namespace: garage
resources:
  - resources.yaml # generated by kustomizer
  - service.yaml
  - cfdtunnel.yaml
  - httproute.yaml
  - deployment.yaml
  - middleware.yaml
  - referencegrant.yaml
  - secret.sops.yaml
  - poddisruptionbudget.yaml
  - ciliumlocalredirectpolicy.yaml

configMapGenerator:
  - name: garage-grafana-dashboards
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
    files:
      # https://git.deuxfleurs.fr/Deuxfleurs/garage/src/tag/v2.3.0/script/telemetry/grafana-garage-dashboard-prometheus.json
      - https://git.deuxfleurs.fr/Deuxfleurs/garage/raw/tag/v2.3.0/script/telemetry/grafana-garage-dashboard-prometheus.json
      - grafana/garage-dashboard.json

patches:
  - patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: global-garage
      spec:
        template:
          spec:
            topologySpreadConstraints:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: garage
                    app.kubernetes.io/instance: global
                maxSkew: 1
                minDomains: 3
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: garage
                    app.kubernetes.io/instance: global
                maxSkew: 1
                minDomains: 3
                topologyKey: topology.kubernetes.io/region
                whenUnsatisfiable: DoNotSchedule

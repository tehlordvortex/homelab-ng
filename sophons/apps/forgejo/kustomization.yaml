            #       allowPrivilegeEscalation: false

            # initContainers:
            #   - name: init-directories
            #     volumeMounts:
            #       - mountPath: /data
            #         mountPropagation: HostToContainer
            #   - name: init-app-ini
            #     volumeMounts:
            #       - mountPath: /data
            #         mountPropagation: HostToContainer
            #   - name: configure-gitea
            #     volumeMounts:

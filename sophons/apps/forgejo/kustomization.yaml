namespace: forgejo
resources:
  - resources.yaml # generated by kustomizer
  # - cfdtunnel.yaml
  - middleware.yaml
  - ../seaweedfs/access-key
  - ../garage/access-keys/infinity-and-beyond
components:
  - patches
  - ../../common/litestream
  - ../../common/litestream/templ-config

images:
  # override the -rootless suffix here instead
  - name: code.forgejo.org/forgejo/forgejo
    newTag: 16.0.3-rootless@sha256:214f4ae63ee78be1e445e58573c88dc7215e72091210852e0df94eaac1a25685

secretGenerator:
  - name: forge-of-creation-forgejo-config
    files:
      - oauth2=config/oauth2.env
      - server=config/server.env
      - security=config/security.env
  - name: forge-of-creation-forgejo-authelia-config
    env: config/authelia.oauth.env

            #         mountPropagation: HostToContainer

  - target:
      kind: Deployment
      name: forge-of-creation-forgejo
      namespace: forgejo
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0
        value:
          name: redka-redis
          restartPolicy: Always
          image: docker.io/nalgeon/redka:1.0.1
          args: ["/db/redka.db"]
          env:
            - name: GOGC
              value: "25"
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory

          ports:
            - name: redis
              containerPort: 6379

          startupProbe:
            exec:
              command: [sh, -c, "valkey-cli PING || exit 1"]

          livenessProbe:
            exec:
              command: [sh, -c, "valkey-cli PING || exit 1"]

          volumeMounts:
            - name: data
              subPath: db
              mountPath: /db
            - name: temp
              subPath: redka
              mountPath: /tmp

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 72Mi
      - op: add
        path: /spec/template/spec/initContainers/0
        value:
          name: juice-mount
          restartPolicy: Always
          # NOTE: the fix for 0% available inodes blocking caching exists
          # in juicefs main, but the docker image hasn't been updated in months
          # this image is pinned to a commit including the fix
          image: pz3.sphns.run/library/juicedata/mount:ce-6541bca
          command:
            - sh
            - -c
            - |-
              set -xeu
              juicefs format --no-update --compress=zstd --block-size=1M \
                --storage=s3 --bucket=https://ps3-global.sphns.run/juiced-%d --shards=6 \
                sqlite3://$META_PATH $VOLUME_NAME
              juicefs config --yes --capacity=8 --dir-stats=true --trash-days=0 \
                sqlite3://$META_PATH

              exec juicefs mount -o async_dio,allow_other --buffer-size=64M \
                --backup-meta=12h --metrics 0.0.0.0:9567 \
                --cache-large-write --cache-expire 2d --free-space-ratio 0.05 \
                --max-uploads 32 --max-downloads 128 \
                sqlite3://$META_PATH $MOUNT_PATH

          env:
            - name: GOGC
              value: "10"
            - name: GOMEMLIMIT
              value: "256MiB"
            - name: META_PATH
              value: /data/db/fs.meta.db
            - name: VOLUME_NAME
              value: forge-of-creation
            - name: MOUNT_PATH
              value: /data/fs
          envFrom:
            - secretRef:
                name: infinity-and-beyond-access-key

          ports:
            - name: jfs-metrics
              containerPort: 9567

          volumeMounts:
            - name: data
              mountPath: /data
              mountPropagation: Bidirectional
            - name: juicefs-cache
              mountPath: /var/jfsCache
            - name: temp
              subPath: juicefs
              mountPath: /tmp

          startupProbe:
            exec:
              command: [mountpoint, -q, /data/fs]
            initialDelaySeconds: 10
            failureThreshold: 6

          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            privileged: true # required for Bidirectional
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 150m
              memory: 128Mi
            limits:
              memory: 512Mi # we respect the OOMkilla
      - op: add
        path: /spec/template/spec/initContainers/0
        value:
          name: litestream-replicate
          restartPolicy: Always
          image: docker.io/litestream/litestream:0.5.11
          command: [sh, /etc/litestream/entrypoint.sh]
          envFrom:
            - configMapRef:
                name: litestream-env
            - secretRef:
                name: infinity-and-beyond-access-key
          env:
            - name: GOGC
              value: "10"
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: LITESTREAM_DBS
              value: fs.meta.db,redka.db,gitea.db
            - name: LITESTREAM_DBS_DIR
              value: /db
            - name: LITESTREAM_DBS_PATTERN
              value: "*.db"
            - name: LITESTREAM_ENDPOINT
              value: https://ps3-global.sphns.run
            - name: LITESTREAM_BUCKET
              value: litestream-ad-infinitum
            - name: LITESTREAM_REPLICA_PATH
              value: ng/forge-of-creation

          ports:
            - name: ls-metrics
              containerPort: 9090

          startupProbe:
            httpGet:
              path: /metrics
              port: ls-metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 12

          volumeMounts:
            - name: data
              subPath: db
              mountPath: /db
            - name: litestream-config
              mountPath: /etc/litestream
              readOnly: true
            - name: temp
              subPath: litestream
              mountPath: /tmp

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              memory: 100Mi

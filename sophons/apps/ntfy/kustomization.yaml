apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ntfy
resources:
  - service.yaml
  - httproute.yaml
  - statefulset.yaml
  - dnsendpoint.yaml
  - ../garage/access-keys/infinity-and-beyond

components:
  - ../../common/litestream
  - ../../common/litestream/templ-config

secretGenerator:
  - name: ntfy
    envs: [.env]

  - name: ntfy-config
    files:
      - server.yaml=config/server.sops.yaml

# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.36.1/statefulset-apps-v1.json
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ntfy
  namespace: ntfy
  labels:
    app.kubernetes.io/name: ntfy
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ntfy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ntfy
    spec:
      priorityClassName: system-cluster-critical
      tolerations:
        - key: "orunmila.sophons.cloud/ase-orun"
          operator: Exists

      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: NotIn
                    # avoid running inside me house if possible
                    values: [ng-east-1, ng-east-2, ng-middle-east]

      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: litestream-replicate
          restartPolicy: Always
          image: docker.io/litestream/litestream
          command: [bash, /etc/litestream/entrypoint.sh]
          envFrom:
            - configMapRef:
                name: litestream-env
            - secretRef:
                name: infinity-and-beyond-access-key
          env:
            - name: GOGC
              value: "10"
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: LITESTREAM_ENDPOINT
              value: https://ps3-global.sphns.run
            - name: LITESTREAM_BUCKET
              value: litestream-ad-infinitum
            - name: LITESTREAM_REPLICA_PATH
              value: ng/ntfy
            - name: LITESTREAM_CONFIG
              value: |-
                dbs:
                  - path: /var/lib/ntfy/cache.db
                    replica:
                      url: "[[replica_url cache.db]]"
                  - path: /var/lib/ntfy/webpush.db
                    replica:
                      url: "[[replica_url webpush.db]]"

          ports:
            - name: ls-metrics
              containerPort: 9090

          startupProbe:
            exec:
              command: [bash, /etc/litestream/restore-probe.sh]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30

          volumeMounts:
            - name: tmp
              subPath: ntfy
              mountPath: "/var/lib/ntfy"
            - name: litestream-config
              mountPath: /etc/litestream
              readOnly: true
            - name: tmp
              subPath: litestream
              mountPath: /tmp

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.25
          args: ["serve", "--config=/etc/ntfy/server.yaml"]

          ports:
            - containerPort: 80
              name: http

          volumeMounts:
            - name: ntfy-config
              mountPath: "/etc/ntfy"
              readOnly: true
            - name: tmp
              subPath: ntfy
              mountPath: "/var/lib/ntfy"

          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory

          envFrom:
            - secretRef:
                name: ntfy

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

      volumes:
        - name: tmp
          emptyDir: {}
        - name: ntfy-config
          secret:
            secretName: ntfy-config
        - name: litestream-config
          configMap:
            name: litestream-config

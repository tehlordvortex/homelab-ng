apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAgent
metadata:
  name: klusterstalker
  namespace: victoriametrics-system
spec:
  replicaCount: 2
  selectAllByDefault: true
  extraArgs:
    enableTCP6: "true"

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

  extraEnvs:
    - name: GOMEMLIMIT
      value: 256MiB

  remoteWrite:
    - url: "http://vmsingle-klusterstalker.victoriametrics-system.svc.cluster.local:8428/api/v1/write"

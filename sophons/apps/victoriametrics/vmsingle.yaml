apiVersion: operator.victoriametrics.com/v1beta1
kind: VMSingle
metadata:
  name: klusterstalker
  namespace: victoriametrics-system
spec:
  retentionPeriod: "5d"
  extraArgs:
    enableTCP6: "true"

  tolerations:
    - key: oduduwa.sophons.cloud/ase-orun
      operator: Exists
    - key: caeneus.sophons.cloud
      operator: Exists

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 512Mi

  extraEnvs:
    - name: GOMEMLIMIT
      value: 512MiB

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault

  storage:
    storageClassName: weedfs-no-repl
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 4Gi


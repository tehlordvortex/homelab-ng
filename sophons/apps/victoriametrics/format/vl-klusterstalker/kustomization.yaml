namespace: victoriametrics-system
resources:
  - ../../../../system/juicefs-csi-driver/format

replacements:
  - sourceValue: mkfs-vl-klusterstalker
    targets:
      - select:
          name: mkfs
          kind: Job
        fieldPaths:
          - metadata.name

patches:
  - patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: mkfs
      spec:
        template:
          spec:
            initContainers:
              - name: litestream-legacy-replicate
                env:
                  - name: VOLUME_NAME
                    value: vl-klusterstalker
            containers:
              - name: format
                env:
                  - name: VOLUME_NAME
                    value: vl-klusterstalker

namespace: traefik
resources:
  - resources.yaml # generated by kustomizer
  - service.yaml
  - daemonset.yaml
  # - syslogngflow.yaml
  - secrets.sops.yaml
  - servicemonitor.yaml
  - dnsendpoint.sops.yaml
  - ciliumlocalredirectpolicy.yaml

images:
  # - name: docker.io/rancher/klipper-lb
  #   newTag: v0.4.16
  # - name: docker.io/alpine/socat
  #   newTag: 1.8.0.3
  - name: docker.io/library/haproxy
    newTag: 3.3.6

secretGenerator:
  - name: cloudflared
    files:
      - 163f32fb-e910-4a18-9ef0-9c5bfe635f33.json=config/163f32fb-e910-4a18-9ef0-9c5bfe635f33.sops.json
      - config/config.yaml
configMapGenerator:
  - name: traefik-haproxy
    files:
      - config/haproxy.cfg
#   - name: traefik-klipper-lb
#     files:
#       - config/klipper-lb.sh

patches:
  - patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: traefik
        namespace: traefik
      spec:
        template:
          spec:
            containers:
              - name: traefik
                env:
                  - name: GOMAXPROCS
                    $patch: delete

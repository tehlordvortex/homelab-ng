namespace: traefik
resources:
  - resources.yaml # generated by kustomizer
  - service.yaml
  - cfdtunnel.yaml
  - daemonset.yaml
  - secrets.sops.yaml
  - servicemonitor.yaml
  - dnsendpoint.sops.yaml
  - ciliumlocalredirectpolicy.yaml

images:
  - name: docker.io/library/haproxy
    newTag: 3.3.6

configMapGenerator:
  - name: traefik-haproxy
    files:
      - config/haproxy.cfg
      - config/cloudflare-ips.txt

patches:
  - patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: traefik
        namespace: traefik
      spec:
        template:
          spec:
            containers:
              - name: traefik
                env:
                  - name: GOMAXPROCS
                    $patch: delete

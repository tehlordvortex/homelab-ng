namespace: traefik
resources:
  - resources.yaml # generated by kustomizer
  - service.yaml
  - daemonset.yaml
  # - syslogngflow.yaml
  - secrets.sops.yaml
  - servicemonitor.yaml
  - dnsendpoint.sops.yaml
  - ciliumlocalredirectpolicy.yaml

secretGenerator:
  - name: cloudflared
    files:
      - 163f32fb-e910-4a18-9ef0-9c5bfe635f33.json=config/163f32fb-e910-4a18-9ef0-9c5bfe635f33.sops.json
      - config/config.yaml

patches:
  - patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: traefik
        namespace: traefik
      spec:
        template:
          spec:
            containers:
              - name: traefik
                env:
                  - name: GOMAXPROCS
                    $patch: delete

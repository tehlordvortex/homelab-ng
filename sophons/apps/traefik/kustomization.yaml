namespace: traefik
configurations:
  - kustomizeconfig.yaml
resources:
  - resources.yaml # generated by kustomizer
  - cronjob.yaml
  - service.yaml
  - cfdtunnel.yaml
  - httproute.yaml
  - middleware.yaml
  - deployment.yaml
  - servicemonitor.yaml
  - dnsendpoint.sops.yaml
  - persistentvolumeclaim.yaml
  - ciliumnetworkpolicy.yaml
  - ciliumlocalredirectpolicy.yaml
  - ciliumegressgatewaypolicy.yaml
  - ciliumcidrgroup.generated.yaml
  - ../../system/crowdsec/bouncer-keys

images:
  - name: docker.io/alpine/curl
    newTag: 8.21.0
  - name: docker.io/alpine/openssl
    newTag: 3.5.8
  - name: ghcr.io/jqlang/jq
    newTag: 1.8.2

secretGenerator:
  - name: traefik-secrets
    env: .env

configMapGenerator:
  - name: positron-ca
    files:
      - ca.crt=config/unifi.ca.crt

  - name: anubis-config
    files:
      - policy.yaml=config/anubis.policy.sops.yaml

  - name: traefik-grafana-dashboards
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
    files:
      - traefik-kubernetes.json=https://grafana.com/api/dashboards/17347/revisions/9/download

patches:
  - patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: traefik
        namespace: traefik
      spec:
        template:
          spec:
            containers:
              - name: traefik
                env:
                  - name: GOMAXPROCS
                    $patch: delete

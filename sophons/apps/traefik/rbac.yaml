# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.34.1/serviceaccount.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-cilium-trusted-ips
  namespace: traefik
---
# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.36.1/clusterrole-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-traefik-cilium-trusted-ips
rules:
  - apiGroups: ["cilium.io"]
    resources: ["ciliumcidrgroups"]
    resourceNames: ["bunny", "cloudflare"]
    verbs: ["get", "create", "patch"]
---
# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.36.1/clusterrolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-traefik-cilium-trusted-ips
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-traefik-cilium-trusted-ips
subjects:
  - kind: ServiceAccount
    name: traefik-cilium-trusted-ips
    namespace: traefik
---
# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.36.1/clusterrole-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-traefik-cilium
rules:
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnodes", "ciliumcidrgroups", "ciliumendpoints"]
    verbs: ["get", "list", "watch"]
---
# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.36.1/clusterrolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-traefik-cilium
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-traefik-cilium
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik

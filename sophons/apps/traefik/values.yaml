# yaml-language-server: $schema=https://github.com/traefik/traefik-helm-chart/raw/refs/tags/v41.4.0/traefik/values.schema.json

versionOverride: 3.7.13
image:
  digest: sha256:f86a2cab1b5c649070c49f883c743dd32d8485a56e3368c5f93b9e91f1e91259

api:
  insecure: true
  debug: true
  dashboard: true
  disableDashboardAd: true

log:
  level: INFO
  format: json
accessLog:
  enabled: true
  format: json

ingressRoute:
  dashboard:
    enabled: true
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/description: Traefik Dashboard
      gethomepage.dev/group: Admin
      gethomepage.dev/icon: traefik.svg
      gethomepage.dev/name: Traefik
      gethomepage.dev/app: traefik
      gethomepage.dev/widget.type: traefik
      gethomepage.dev/widget.url: http://traefik.traefik:8080
      gethomepage.dev/href: http://traefik-internal.sophons.cloud:8080/dashboard

additionalArguments:
  - --serversTransport.maxIdleConnsPerHost=256
  - --serversTransport.forwardingTimeouts.idleConnTimeout=300s

ports:
  traefik:
    port: 8080
    expose:
      default: true
      internal: true
    http:
      middlewares:
        - traefik_default-compression@kubernetescrd

  web:
    port: 80
    http:
      aliasHeadersStrategy: delete
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
      middlewares:
        - traefik_cilium-trustedips@kubernetescrd
        - crowdsec_crowdsec-bouncer@kubernetescrd
        - traefik_default-compression@kubernetescrd

  websecure:
    port: 443
    expose:
      internal: true
    http3:
      enabled: true
    transport:
      respondingTimeouts:
        # uploading blobs to gitea etc can take a while
        # thanks [fuck-all]mbps upload internet.
        readTimeout: 600s
        idleTimeout: 600s
    http:
      aliasHeadersStrategy: delete
      middlewares:
        # WARN: do not remove without turning off insecure forwardedHeaders
        - traefik_cilium-trustedips@kubernetescrd
        - crowdsec_crowdsec-bouncer@kubernetescrd
        - traefik_default-compression@kubernetescrd
    forwardedHeaders:
      # WARN: must be false if cilium-trustedips middleware isn't enabled
      insecure: true

  ssh:
    port: 22
    expose:
      default: true
      internal: true

service:
  enabled: true
  spec:
    type: ClusterIP
    # TODO: https://github.com/cilium/cilium/issues/44060
    # trafficDistribution: PreferSameNode # not supported by cilium
    ipFamilies: ["IPv4", "IPv6"]
    ipFamilyPolicy: RequireDualStack
    clusterIP: 10.43.0.69
    clusterIPs:
      - 10.43.0.69
      - 2001:cafe:43::69
    # externalTrafficPolicy: Local

  additionalServices:
    internal:
      single: true
      annotations:
        metallb.io/address-pool: internal
        external-dns.alpha.kubernetes.io/hostname: >
          traefik-internal.sophons.cloud
        external-dns.alpha.kubernetes.io/cloudflare-proxied: "false"
      spec:
        type: LoadBalancer
        # trafficDistribution: PreferSameNode
        externalTrafficPolicy: Local

providers:
  kubernetesCRD:
    safeNaming: true
    nativeLBByDefault: true
    allowCrossNamespace: true
  kubernetesIngress:
    nativeLBByDefault: true
    # allowCrossNamespace: true
  kubernetesGateway:
    enabled: true
    nativeLBByDefault: true
    # allowCrossNamespace: true
    experimentalChannel: true
  file:
    enabled: true
    content:
      http:
        routers:
          headplane:
            entryPoints: [web, websecure]
            service: headplane
            rule: Host(`hs.vrtx.sh`) && PathPrefix(`/admin`)
          headscale:
            entryPoints: [web, websecure]
            service: headscale
            rule: Host(`hs.vrtx.sh`)
          headscale-grpc:
            entryPoints: [websecure]
            service: headscale-grpc
            rule: Host(`gghs.vrtx.sh`)

        services:
          headplane:
            loadBalancer:
              servers:
                - url: http://headscale-proxy-headless.headscale.svc.cluster.local:3000
              passHostHeader: true
              serversTransport: headscale@file
          headscale:
            loadBalancer:
              servers:
                - url: http://headscale-proxy-headless.headscale.svc.cluster.local:8080
              passHostHeader: true
              serversTransport: headscale@file
          headscale-grpc:
            loadBalancer:
              servers:
                - url: h2c://headscale-proxy-headless.headscale.svc.cluster.local:50051
              passHostHeader: true
              serversTransport: headscale-grpc@file

        serversTransports:
          headscale:
            serverName: hs.vrtx.sh
          headscale-grpc:
            serverName: gghs.vrtx.sh

      tls:
        stores:
          default:
            defaultCertificate:
              certFile: /etc/traefik/gateway-tls/tls.crt
              keyFile: /etc/traefik/gateway-tls/tls.key

gateway:
  listeners:
    traefik: # HTTP listener that matches entryPoint `traefik`
      port: 8080
      protocol: HTTP
      namespacePolicy:
        from: All
    web: # HTTP listener that matches entryPoint `web`
      port: 80
      protocol: HTTP
      namespacePolicy:
        from: All
    websecure: # HTTPS listener that matches entryPoint `websecure`
      port: 443
      mode: Terminate
      protocol: HTTPS
      namespacePolicy:
        from: All
      certificateRefs:
        - kind: Secret
          group: ""
          name: gateway-tls
    ssh: # TCP listener that matches entryPoint `ssh`
      port: 22
      protocol: TCP
      namespacePolicy:
        from: All

priorityClassName: system-node-critical
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
deployment:
  kind: DaemonSet
  labels:
    app.kubernetes.io/component: proxy
  podLabels:
    app.kubernetes.io/component: proxy
  hostUsers: false

  additionalVolumes:
    - name: plugins # volume name must be plugins for helm chart to skip mounting emptyDir
      persistentVolumeClaim:
        claimName: traefik-data
    - name: plugin-cacheify
      image:
        reference: pz3.sphns.run/library/traefik/plugins/github.com/ciaranj/cacheify:dev-409ae70-10
    - name: plugin-crowdsec-bouncer
      image:
        reference: pz3.sphns.run/traefik/plugins/github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin@sha256:00c85712b89a9ffc9ae9413887774de482dfe3316d230fd689ac124504f9e723
    - name: plugin-cilium-trustedips
      configMap:
        name: traefik-plugin-cilium-trustedips

persistence:
  enabled: false
additionalVolumeMounts:
  - name: plugins
    mountPath: /cache
    subPath: cache
  - name: plugins
    mountPath: /plugins-storage
    subPath: plugins-storage

startupProbe:
  httpGet:
    path: /ping
    port: 8080
  failureThreshold: 15

env:
  - name: GOGC
    value: "10"
  - name: GOMEMLIMIT
    valueFrom:
      resourceFieldRef:
        resource: limits.memory
resources:
  requests:
    cpu: 75m
    memory: 100Mi
  limits:
    memory: 512Mi

volumes:
  - type: secret
    name: gateway-tls
    mountPath: /etc/traefik/gateway-tls
  - type: secret
    name: crowdsec-bouncer-keys
    mountPath: /etc/traefik/crowdsec

tolerations:
  - key: caeneus.sophons.cloud
    operator: Exists

experimental:
  abortOnPluginFailure: true
  # plugins:
  #   souin:
  #     moduleName: "github.com/darkweak/souin"
  #     version: "v1.7.8"
  #   crowdsec-bouncer-traefik-plugin:
  #     moduleName: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
  #     version: "v1.7.1"
  #   cacheify:
  #     moduleName: "github.com/ciaranj/cacheify"
  #     version: "v1.0.0"
  localPlugins:
    cacheify:
      moduleName: github.com/ciaranj/cacheify
      mountPath: /plugins-local/src/github.com/ciaranj/cacheify
      type: localPath
      volumeName: plugin-cacheify
    crowdsec-bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      mountPath: /plugins-local/src/github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      type: localPath
      volumeName: plugin-crowdsec-bouncer
    cilium-trustedips:
      moduleName: pluginciliumtrustedips
      mountPath: /plugins-local/src/pluginciliumtrustedips
      type: localPath
      volumeName: plugin-cilium-trustedips

securityContext:
  capabilities:
    add: ["NET_BIND_SERVICE"]

podSecurityContext:
  fsGroup: 65532
  sysctls:
    # allows icmp traffic (ping, traceroute) to resources behind cloudflared.
    - name: net.ipv4.ping_group_range
      value: "65532 65532"

metrics:
  prometheus:
    service:
      enabled: true
    disableAPICheck: false
    serviceMonitor:
      enabled: true
      metricRelabelings:
        - sourceLabels: [__name__]
          separator: ;
          regex: ^fluentd_output_status_buffer_(oldest|newest)_.+
          replacement: $1
          action: drop
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          separator: ;
          regex: ^(.*)$
          targetLabel: nodename
          replacement: $1
          action: replace
      jobLabel: traefik
      interval: 30s
      honorLabels: true
    headerLabels:
      user_id: X-User-Id
      tenant: X-Tenant
    prometheusRule:
      enabled: true
      rules:
        - alert: TraefikDown
          expr: up{job="traefik"} == 0
          for: 5m
          labels:
            context: traefik
            severity: warning
          annotations:
            summary: "Traefik Down"
            description: "{{ $labels.pod }} on {{ $labels.nodename }} is down"

apiVersion: cloudflared-operator.vrtx.sh/v1alpha1
kind: CfdTunnel
metadata:
  name: traefik
  namespace: traefik
spec:
  serviceMonitor: {}
  dns:
    externalDNS:
      kind:
        generated:
          endpoints:
            - dnsName: positron.sophons.cloud

  accountId: 93814820f122031e8f5004eb893430f0
  apiToken:
    secretRef:
      name: cf-dns-api-token
      namespace: default
    key: api-token

  serviceRef:
    name: traefik
  protocol: http2
  ingress:
    - service: https://traefik.traefik.svc.cluster.local
  originRequestConfig: |
    matchSNItoHost: true
    http2Origin: true

  podSpecOverrides:
    tolerations:
      - key: orunmila.sophons.cloud/ase-orun
        operator: Exists
      - key: caeneus.sophons.cloud
        operator: Exists
  containerOverrides:
    name: cloudflared
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        memory: 72Mi

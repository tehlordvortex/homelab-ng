# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.35.2/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bunny-pull-zone-sync
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-traefik
    app.kubernetes.io/component: bunny-pull-zone-sync
spec:
  schedule: "0 3 * * *" # 3am daily
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-traefik
        app.kubernetes.io/component: bunny-pull-zone-sync
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik
            app.kubernetes.io/component: bunny-pull-zone-sync
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault

          volumes:
            - name: tmp
              emptyDir: {}
            - name: cert
              secret:
                secretName: gateway-tls
            - name: bunny-sync
              configMap:
                name: bunny-sync
            - name: jq
              image:
                reference: ghcr.io/jqlang/jq

          initContainers:
            - name: hostnames
              image: docker.io/alpine/openssl
              command: [/bin/ash, /bunny-sync/hostnames.sh]
              env:
                - name: DNS_NAMES
                  value: |-
                    DNS:*.vrtx.sh
                    DNS:*.vrtx.run
                    DNS:*.sphns.run
                    DNS:*.kaos.nexus
                    DNS:*.sophons.cloud

              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /cert
                  name: cert
                  readOnly: true
                - mountPath: /bunny-sync
                  name: bunny-sync
                  readOnly: true

              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]

          containers:
            - name: sync
              image: docker.io/alpine/curl
              command: [/bin/ash, /bunny-sync/sync.sh]

              env:
                - name: PULL_ZONE_ID
                  value: "6407919"
                - name: API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: traefik-secrets
                      key: BUNNY_API_KEY

              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /jq
                  name: jq
                  readOnly: true
                - mountPath: /cert
                  name: cert
                  readOnly: true
                - mountPath: /bunny-sync
                  name: bunny-sync
                  readOnly: true

              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
---

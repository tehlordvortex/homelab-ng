labels:
  app.kubernetes.io/name: traefik
  app.kubernetes.io/instance: traefik-traefik
  app.kubernetes.io/component: node-dnat

localEndpointSelector:
  matchLabels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-traefik

public:
  toPorts:
    - name: ssh
      port: "22"
      protocol: TCP
    - name: web
      port: "80"
      protocol: TCP
    - name: websecure
      port: "443"
      protocol: TCP
    - name: websecure-http3
      port: "443"
      protocol: UDP

internal:
  toPorts:
    - name: traefik
      port: "8080"
      protocol: TCP

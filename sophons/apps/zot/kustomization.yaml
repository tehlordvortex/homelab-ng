namespace: zzzot
resources:
  - resources.yaml # generated by kustomizer
  - service.yaml
  - cfdtunnel.yaml
  - httproute.yaml
  - dnsendpoint.yaml
  - traefikservice.yaml
  - serverstransport.yaml
  - ../../common/b2/trisolaris-access-key

configMapGenerator:
  - name: zenlesszonezot
    files:
      - config.json=config/zot.json

secretGenerator:
  - name: z3
    files:
      - htpasswd=config/sops.htpasswd
      - oidc.json=config/oidc.sops.json
      - session.json=config/session.sops.json
      - sync-auth.json=config/sync-auth.sops.json
  - name: z3-access-key
    env: .env
  - name: z3-kluzter-pull-cred
    type: kubernetes.io/dockerconfigjson
    options:
      disableNameSuffixHash: true
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "zzzot, homepage"
    files:
      - .dockerconfigjson=config/dockerconfig.sops.json

patches:
  - patch: |
      apiVersion: v1
      kind: Service
      metadata:
        name: zenlesszonezot
        namespace: zzzot
      spec:
        # sessionAffinity: ClientIP
        # sessionAffinityConfig:
        #   clientIP:
        #     timeoutSeconds: 900
        clusterIP: 10.43.0.42
        clusterIPs:
          - 10.43.0.42
          - 2001:cafe:43::42
        ipFamilyPolicy: RequireDualStack
        ipFamilies: [IPv4, IPv6]

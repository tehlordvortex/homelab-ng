namespace: zzzot
resources:
  - resources.yaml # generated by kustomizer
  - cfdtunnel.yaml
  - httproute.yaml
  - dnsendpoint.yaml
  - redissentinel.yaml
  - servicemonitor.yaml
  - traefikservice.yaml
  - serverstransport.yaml
  - redisreplication.yaml
  - poddisruptionbudget.yaml

configMapGenerator:
  - name: zenlesszonezot
    files:
      - config.json=config/zot.json
      - htpasswd=config/sops.htpasswd

secretGenerator:
  - name: z3
    files:
      - oidc.json=config/oidc.sops.json
      - session.json=config/session.sops.json
      - sync-auth.json=config/sync-auth.sops.json
    env: .env
  - name: z3-kluzter-pull-cred
    type: kubernetes.io/dockerconfigjson
    options:
      disableNameSuffixHash: true
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "zzzot, homepage"
    files:
      - .dockerconfigjson=config/dockerconfig.sops.json
  - name: gateway-tls
    options:
      disableNameSuffixHash: true
      annotations:
        reflector.v1.k8s.emberstack.com/reflects: "default/gateway-tls"

patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: zenlesszonezot
        namespace: zzzot
      spec:
        template:
          spec:
            topologySpreadConstraints:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: zot
                    app.kubernetes.io/instance: zenlesszonezot
                maxSkew: 1
                minDomains: 3
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: zot
                    app.kubernetes.io/instance: zenlesszonezot
                maxSkew: 1
                minDomains: 3
                topologyKey: topology.kubernetes.io/region
                whenUnsatisfiable: DoNotSchedule

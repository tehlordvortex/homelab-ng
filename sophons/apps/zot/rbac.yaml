# https://github.com/container-registry/harbor-workload-identity-federation/blob/main/examples/talos/node-audience-rbac.yaml
# ClusterRole that allows kubelets (the system:nodes group) to request service
# account tokens with the "zzzot" audience. Required by the
# ServiceAccountNodeAudienceRestriction feature gate (default-on in k8s 1.34+).
# Without it, kubelet token requests fail with
# "audience not found in pod spec volume".
#
# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.34.1/clusterrole-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: zzzot-node-audience-token
rules:
  - apiGroups: [""]
    # The audience string is the RBAC resource here (resource-as-audience).
    resources: [oci.sphns.run]
    verbs: [request-serviceaccounts-token-audience]
---
# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.34.1/clusterrolebinding-rbac-v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: zzzot-node-audience-token
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: zzzot-node-audience-token
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:nodes

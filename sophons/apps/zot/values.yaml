image:
  # repository: ghcrd.sphns.run/project-zot/zot
  repository: ghcrd.sphns.run/tehlordvortex/project-zot/zot
  # repository: pz3.sphns.run/project-zot/zot
  # 2.1.21 + redisworksfineasasubpathdriveridkwhyitsnotlikethat
  tag: latest@sha256:fac5d61964f9009ab7a7cc94e2a4561f9f5f3bc5df20b7d7d613fd201f7c8c01
  # tag: latest@sha256:d6152b7cd688af29ea85e0a1ab9fb76e38c5d67ea03421c923eff7d1bf889c22

replicaCount: 2
podDisruptionBudget:
  enabled: true
  minAvailable: 1

affinity:
  podAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          namespaces: [alpha-centauri-system]
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: valkey
              app.kubernetes.io/instance: valkeyrie
          topologyKey: topology.kubernetes.io/zone

  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - preference:
          matchExpressions:
            - key: cluster.garage.sophons.cloud/global
              operator: In
              values: ["true"]
        weight: 69
      - preference:
          matchExpressions:
            - key: topology.kubernetes.io/region
              operator: NotIn
              values: [ng]
        weight: 67

topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/name: zot
        app.kubernetes.io/instance: zenlesszonezot
    maxSkew: 1
    minDomains: 2
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
    matchLabelKeys: [pod-template-hash]

service:
  type: ClusterIP
  trafficDistribution: PreferClose
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

persistence: false
resources:
  requests:
    cpu: 75m
    memory: 100Mi
  limits:
    memory: 400Mi
startupProbe:
  failureThreshold: 120

podSecurityContext:
  runAsUser: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

extraArgs: [serve, /etc/zot/config.yaml]
env:
  - name: GOGC
    value: "10"
  - name: GOMEMLIMIT
    valueFrom:
      resourceFieldRef:
        resource: limits.memory
  # https://github.com/project-zot/zot/issues/2964#issuecomment-4764235839
  - name: GODEBUG
    value: http2client=0
externalSecrets:
  - secretName: z3
    mountPath: /secrets/z3
extraVolumeMounts:
  - name: tmp
    subPath: config
    mountPath: /etc/zot
  - name: tmp
    subPath: zot
    mountPath: /tmp

extraVolumes:
  - name: config-templ
    configMap:
      name: zenlesszonezot
  - name: tmp
    emptyDir: {}

initContainers:
  - name: template-config
    # image: ghcrd.sphns.run/tehlordvortex/alpine/envsubst:3.24.1@sha256:9a8e0760a2068d86c0583332a809664c2051d489faa409c079f41a6e888f78ae
    image: pz3.sphns.run/alpine/envsubst:3.24.1@sha256:e54a472f3c276ca68cbb45886b05b61f72b9364b916ed4018c5346304593c887
    # imagePullPolicy: Never
    command:
      - sh
      - -c
      - |
        set -xeuo pipefail
        envsubst '$B2_ACCESS_KEY_ID $B2_SECRET_ACCESS_KEY $GARAGE_ACCESS_KEY_ID $GARAGE_SECRET_ACCESS_KEY' \
          < /etc/zot.templ/config.yaml > /etc/zot/config.yaml

    env:
      - name: B2_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: trisolaris-access-key
            key: AWS_ACCESS_KEY_ID
      - name: B2_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: trisolaris-access-key
            key: AWS_SECRET_ACCESS_KEY
      - name: GARAGE_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: z3-access-key
            key: AWS_ACCESS_KEY_ID
      - name: GARAGE_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: z3-access-key
            key: AWS_SECRET_ACCESS_KEY

    volumeMounts:
      - name: config-templ
        mountPath: /etc/zot.templ
        readOnly: true
      - name: tmp
        subPath: config
        mountPath: /etc/zot

    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]

    resources:
      requests:
        memory: 1Mi
      limits:
        memory: 16Mi

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    basicAuth: null

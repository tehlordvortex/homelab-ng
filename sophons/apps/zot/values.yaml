replicaCount: 3
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - preference:
          matchExpressions:
            - key: cluster.garage.sophons.cloud/global
              operator: In
              values: ["true"]
        weight: 100

  podAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 25
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app: redis-z3
          topologyKey: topology.kubernetes.io/zone

service:
  type: ClusterIP
  trafficDistribution: PreferClose
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

persistence: false
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 300Mi
startupProbe:
  initialDelaySeconds: 15
  failureThreshold: 60

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

env:
  - name: GOGC
    value: "25"
  - name: GOMEMLIMIT
    valueFrom:
      resourceFieldRef:
        resource: limits.memory
  - name: AWS_ACCESS_KEY_ID
    valueFrom:
      secretKeyRef:
        name: z3
        key: AWS_ACCESS_KEY_ID
  - name: AWS_SECRET_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: z3
        key: AWS_SECRET_ACCESS_KEY
externalSecrets:
  - secretName: z3
    mountPath: /secrets/z3
extraVolumeMounts:
  - name: config
    mountPath: /etc/zot
  - name: tmp
    mountPath: /tmp/zot

extraVolumes:
  - name: config
    configMap:
      name: zenlesszonezot
  - name: tmp
    emptyDir: {}

metrics:
  enabled: true
  serviceMonitor:
    enabled: true
    basicAuth: null

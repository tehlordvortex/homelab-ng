apiVersion: cloudflared-operator.vrtx.sh/v1alpha1
kind: CfdTunnel
metadata:
  name: zenlesszonezot
  namespace: zzzot
spec:
  serviceMonitor: {}
  dns:
    externalDNS:
      kind:
        generated:
          endpoints:
            - dnsName: zenlesszonezot.sophons.cloud
            - dnsName: oci.sophons.cloud
            - dnsName: oci.sphns.run
            - dnsName: z3.sphns.run

  accountId: 93814820f122031e8f5004eb893430f0
  apiToken:
    secretRef:
      name: cf-dns-api-token
      namespace: default
    key: api-token

  serviceRef:
    name: zenlesszonezot
  protocol: http2
  ingress:
    - service: https://traefik.traefik.svc.cluster.local
  originRequestConfig: |
    matchSNItoHost: true
    http2Origin: true

  containerOverrides:
    name: cloudflared
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        memory: 48Mi

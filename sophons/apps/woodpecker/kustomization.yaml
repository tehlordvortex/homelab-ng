namespace: woodpecker-system
resources:
  - resources.yaml # generated by kustomizer
  - service.yaml
  - cfdtunnel.yaml
  - httproute.yaml
  - deployment.yaml
  - ciliumnetworkpolicy.yaml
  - persistentvolumeclaim.yaml
  - ../garage/access-keys/infinity-and-beyond

components:
  - ../../common/litestream
  - ../../common/litestream/templ-config

images:
  - name: ghcr.io/rclone/rclone
    newTag: 1.74.4@sha256:c61954aaa32328a5486715dd063a81c7879f5195ad3505cd362deddd509dc4a1
  - name: docker.io/library/registry
    newTag: 3.1.1@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
  - name: codeberg.org/vrtxdotsh/woodpecker-ext-ci-identity
    newTag: next-474fe38146@sha256:a3d68cab80bc4f4532d8e6e0b17aad2497a27fd7d0432bf1b055f79d0fd26267
  - name: codeberg.org/vrtxdotsh/woodpecker-addon-log-s3
    newTag: main-scratch@sha256:5204a1701c46e6efb7aaf09c5bea7a480d86e551fe9ededa4599b3165beb783b

secretGenerator:
  - name: birb-woodpecker
    env: .env
  - name: birb-identity
    files:
      - identity.rsa.pem=config/identity.rsa.sops.pem

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: birb-server
      spec:
        template:
          spec:
            hostAliases:
              - ip: 10.43.0.69
                hostnames:
                  - tig.vrtx.sh
              - ip: 2001:cafe:43::69
                hostnames:
                  - tig.vrtx.sh

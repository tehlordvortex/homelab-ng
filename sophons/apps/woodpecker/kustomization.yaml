namespace: woodpecker-system
resources:
  - resources.yaml # generated by kustomizer
  - cfdtunnel.yaml
  - httproute.yaml
  - persistentvolumeclaim.yaml
  - ../garage/access-keys/infinity-and-beyond

components:
  - ../../common/litestream
  - ../../common/litestream/templ-config

secretGenerator:
  - name: birb-woodpecker
    env: .env

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: birb-server
      spec:
        template:
          spec:
            hostAliases:
              - ip: 10.43.0.69
                hostnames:
                  - tig.vrtx.sh
              - ip: 2001:cafe:43::69
                hostnames:
                  - tig.vrtx.sh

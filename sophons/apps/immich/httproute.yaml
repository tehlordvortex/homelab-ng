apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gimmich
  namespace: immich
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure

  hostnames:
    - gimmich.sophons.cloud

  rules:
    - backendRefs:
        - name: gimmich-server
          port: 2283

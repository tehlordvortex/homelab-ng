defaultPodOptions:
  nodeSelector:
    kubernetes.io/hostname: sophons-caeneus
  tolerations:
    - key: caeneus.sophons.cloud
      operator: Exists

  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    runAsGroup: 0
    fsGroup: 0
    seccompProfile:
      type: RuntimeDefault

controllers:
  main:
    containers:
      main:
        image:
          tag: v2.7.5
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]

valkey:
  enabled: true

  controllers:
    main:
      containers:
        main:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi

  persistence:
    data:
      enabled: true
      type: persistentVolumeClaim
      storageClass: local-path

immich:
  metrics:
    enabled: true

  persistence:
    library:
      existingClaim: immich-media-less-big-boi

server:
  enabled: true

  controllers:
    main:
      strategy: Recreate

      containers:
        main:
          ports:
            - containerPort: 2283
              hostPort: 2283
              name: http
              protocol: TCP

          env:
            CPU_CORES: "8"
            IMMICH_LOG_LEVEL: debug
            IMMICH_TRUSTED_PROXIES: 10.41.0.0/16,::ffff:10.41.0.0/112,::ffff:0a29:0000/112,2001:cafe:41::/56
            IMMICH_ALLOW_SETUP: "false"
            DB_HOSTNAME:
              valueFrom:
                secretKeyRef:
                  name: gimmich-postgres-app
                  key: host
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: gimmich-postgres-app
                  key: user
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: gimmich-postgres-app
                  key: password
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: gimmich-postgres-app
                  key: dbname

          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 5Gi

          securityContext:
            allowPrivilegeEscalation: true
            privileged: true

  persistence:
    dev-dri-card2:
      type: hostPath
      hostPath: /dev/dri/card2
      hostPathType: CharDevice
      advancedMounts:
        main:
          main:
            - path: /dev/dri/card2

    dev-dri-renderd129:
      type: hostPath
      hostPath: /dev/dri/renderD129
      hostPathType: CharDevice
      advancedMounts:
        main:
          main:
            - path: /dev/dri/renderD129

    dev-kfd:
      type: hostPath
      hostPath: /dev/kfd
      hostPathType: CharDevice
      advancedMounts:
        main:
          main:
            - path: /dev/kfd

machine-learning:
  enabled: true

  controllers:
    main:
      strategy: Recreate

      containers:
        main:
          image:
            repository: ghcrd.sphns.run/immich-app/immich-machine-learning
            tag: v2.7.5-rocm
            pullPolicy: IfNotPresent

          env:
            MACHINE_LEARNING_REQUEST_THREADS: "4"
            MACHINE_LEARNING_MODEL_INTER_OP_THREADS: "2"
            MACHINE_LEARNING_MODEL_INTRA_OP_THREADS: "3"
            # MACHINE_LEARNING_DEVICE_ID: "1" # 0 is the igpu
            # MACHINE_LEARNING_DEVICE_IDS: "1" # 0 is the igpu
            # HIP_VISIBLE_DEVICES: "1"
            # ROCR_VISIBLE_DEVICES: "1"
            # HSA_USE_SVM: "0"
            HSA_OVERRIDE_GFX_VERSION: "11.0.0"

          resources:
            requests:
              cpu: 350m
              memory: 512Mi
            limits:
              memory: 4Gi

          securityContext:
            allowPrivilegeEscalation: true
            privileged: true

  persistence:
    cache:
      enabled: true
      type: persistentVolumeClaim
      storageClass: local-path
      accessMode: ReadWriteOnce

    dev-dri-card1:
      type: hostPath
      hostPath: /dev/dri/card1
      hostPathType: CharDevice
      advancedMounts:
        main:
          main:
            - path: /dev/dri/card1

    dev-dri-renderd128:
      type: hostPath
      hostPath: /dev/dri/renderD128
      hostPathType: CharDevice
      advancedMounts:
        main:
          main:
            - path: /dev/dri/renderD128

    dev-kfd:
      type: hostPath
      hostPath: /dev/kfd
      hostPathType: CharDevice
      advancedMounts:
        main:
          main:
            - path: /dev/kfd

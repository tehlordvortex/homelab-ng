apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: bluesky-pds
  namespace: bluesky
spec:
  endpoints:
    - dnsName: pds.vrtx.sh
      recordType: CNAME
      targets:
        - cfd-traefik.sophons.cloud
    - dnsName: bsky.vrtx.sh
      recordType: CNAME
      targets:
        - cfd-traefik.sophons.cloud

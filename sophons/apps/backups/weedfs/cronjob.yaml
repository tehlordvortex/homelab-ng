# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.35.2/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weedfs-backup-to-rclone-backup
  namespace: backup-system
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: weedfs
    app.kubernetes.io/component: backup
spec:
  schedule: "0 3 * * *" # 3am daily
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/instance: weedfs
        app.kubernetes.io/component: backup
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/instance: weedfs
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          nodeSelector:
            kubernetes.io/hostname: sophons-caeneus
          tolerations:
            - key: caeneus.sophons.cloud
              operator: Exists

          containers:
            - name: backup
              image: docker.io/chrislusf/seaweedfs:4.17
              restartPolicy: OnFailure
              args:
                - filer.backup
                - -filer=weedfs-seaweedfs-filer-client.weed-system:8888
                - -retentionDays=30

              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: trisolaris-access-key
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: trisolaris-access-key
                      key: AWS_SECRET_ACCESS_KEY

              ports:
                - containerPort: 9327
                  protocol: TCP
                  name: metrics

              livenessProbe:
                httpGet:
                  path: /metrics
                  port: metrics

              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /etc/seaweedfs/replication.toml
                  name: config
                  subPath: s3.replication.toml

              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]

          volumes:
            - name: tmp
              emptyDir: {}
            - name: config
              configMap:
                name: weed-backup
---
# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.35.2/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: weedfs-backup-to-rclone-crypt-b2
  namespace: backup-system
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/instance: weedfs
    app.kubernetes.io/component: backup-crypt-b2
spec:
  schedule: "0 3 * * *" # 3am daily
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/instance: weedfs
        app.kubernetes.io/component: backup-crypt-b2
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: seaweedfs
            app.kubernetes.io/instance: weedfs
            app.kubernetes.io/component: backup-crypt-b2
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          affinity:
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: rclone
                        app.kubernetes.io/instance: crypt-b2
                    namespaceSelector:
                      matchLabels:
                        kubernetes.io/metadata.name: default
                    topologyKey: topology.kubernetes.io/zone
                  weight: 100
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - preference:
                    matchExpressions:
                      - key: topology.kubernetes.io/region
                        operator: NotIn
                        values: [ng]
                  weight: 100

          containers:
            - name: backup
              image: docker.io/chrislusf/seaweedfs:4.17
              restartPolicy: OnFailure
              args:
                - filer.backup
                - -filer=weedfs-seaweedfs-filer-client.weed-system:8888
                - -retentionDays=30

              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: trisolaris-access-key
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: trisolaris-access-key
                      key: AWS_SECRET_ACCESS_KEY

              ports:
                - containerPort: 9327
                  protocol: TCP
                  name: metrics

              livenessProbe:
                httpGet:
                  path: /metrics
                  port: metrics

              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                - mountPath: /etc/seaweedfs/replication.toml
                  name: config
                  subPath: b2.replication.toml

              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]

          volumes:
            - name: tmp
              emptyDir: {}
            - name: config
              configMap:
                name: weed-backup

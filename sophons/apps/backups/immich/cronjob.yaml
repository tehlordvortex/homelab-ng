# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.35.2/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gimmich-backup-to-rclone-time-machine
  namespace: backup-system
  labels:
    app.kubernetes.io/name: immich
    app.kubernetes.io/instance: gimmich
    app.kubernetes.io/component: backup-time-machine
spec:
  schedule: "0 3 * * *" # 3am daily
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: immich
        app.kubernetes.io/instance: gimmich
        app.kubernetes.io/component: backup-time-machine
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: immich
            app.kubernetes.io/instance: gimmich
            app.kubernetes.io/component: backup-time-machine
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

          tolerations:
            - key: caeneus.sophons.cloud
              operator: Exists

          initContainers:
            - name: restic-forget
              image: ghcr.io/restic/restic
              restartPolicy: OnFailure
              args:
                - forget
                - -v
                - --host=gimmich
                - --group-by=host
                - --prune
                - --keep-within-daily=30d
              envFrom:
                - secretRef:
                    name: restic-password
              env:
                - name: RESTIC_REPOSITORY
                  value: rest:http://rclone-time-machine:8081/gimmich/
                - name: RESTIC_REST_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: trisolaris-access-key
                      key: AWS_ACCESS_KEY_ID
                - name: RESTIC_REST_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: trisolaris-access-key
                      key: AWS_SECRET_ACCESS_KEY

              volumeMounts:
                - mountPath: /tmp
                  name: tmp
                  subPath: backup-tmp
                - mountPath: /.cache
                  name: tmp
                  subPath: backup-cache

              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]

          containers:
            - name: restic-backup
              image: ghcr.io/restic/restic
              restartPolicy: OnFailure
              args:
                - backup
                - -vv
                - --host=gimmich
                - --read-concurrency=20
                - /gimmich/library
                - /gimmich/upload
                - /gimmich/profile
              envFrom:
                - secretRef:
                    name: restic-password
              env:
                - name: RESTIC_REPOSITORY
                  value: rest:http://rclone-time-machine:8081/gimmich/
                - name: RESTIC_REST_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: trisolaris-access-key
                      key: AWS_ACCESS_KEY_ID
                - name: RESTIC_REST_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: trisolaris-access-key
                      key: AWS_SECRET_ACCESS_KEY

              volumeMounts:
                - mountPath: /gimmich
                  name: gimmich
                  readOnly: true
                - mountPath: /tmp
                  name: tmp
                  subPath: backup-tmp
                - mountPath: /.cache
                  name: tmp
                  subPath: backup-cache

              securityContext:
                privileged: false
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]

          volumes:
            - name: tmp
              emptyDir: {}
            - name: gimmich
              persistentVolumeClaim:
                claimName: backup-immich-media-less-big-boi
---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rclone-s3-backup
  namespace: backup-system
  labels:
    app.kubernetes.io/name: rclone
    app.kubernetes.io/instance: backup
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure

  hostnames:
    - ps3-backup.sphns.run

  rules:
    - backendRefs:
        - name: rclone-backup
          port: 8080
---

namespace: backup-system
resources:
  - cronjob.yaml
  - ../restic-password
components:
  - ../components/images

configMapGenerator:
  - name: rclone-garage-config
    literals:
      - RCLONE_CONFIG_GARAGE_TYPE=s3
      - RCLONE_CONFIG_GARAGE_ENDPOINT=https://ps3-global.sphns.run
      - RCLONE_CONFIG_GARAGE_REGION=global
      - RCLONE_CONFIG_GARAGE_ENV_AUTH=true

secretGenerator:
  - name: global-garage-access-key
    env: .env

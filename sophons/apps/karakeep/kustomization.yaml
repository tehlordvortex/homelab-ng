namespace: karakeep

secretGenerator:
  - name: karakeep
    env: .env

resources:
  - resources.yaml # generated by kustomizer
  - httproute.yaml
  - ciliumnetworkpolicy.yaml
  - ../../apps/garage/access-keys/hoarder
  - ../../apps/garage/access-keys/infinity-and-beyond
components:
  - ../../common/litestream
  - ../../common/litestream/templ-config
  - ../../common/tailscale
  - ../../common/tailscale/ephemeral-auth

patches:
  - target:
      kind: StatefulSet
      name: karakeep-meilisearch
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false

#
# IMPORTANT NOTE
#
# This chart inherits from the bjw-s library chart. You can check the default values/options here:
# https://github.com/bjw-s/helm-charts/tree/main/charts/library/common
#
applicationProtocol: https
applicationHost: hoarder.sophons.cloud

secrets:
  karakeep:
    enabled: false
  meilesearch:
    enabled: false

ingress:
  karakeep:
    enabled: false

controllers:
  karakeep:
    statefulset:
      volumeClaimTemplates: []
    pod:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - ng
              weight: 100
    containers:
      karakeep:
        image:
          tag: 0.32.0
        # Next.js is a plague :(
        resources:
          requests:
            cpu: 150m
            memory: 300Mi
          limits:
            memory: 756Mi

        envFrom:
          - secretRef:
              name: karakeep

        env:
          DISABLE_SIGNUPS: "true"
          DB_WAL_MODE: "true"
          BROWSER_WEB_URL: null
          # BROWSER_WEBSOCKET_URL: ws://karakeep-chrome:3000?token=waososecure
          BROWSER_WEBSOCKET_URL: ws://karakeep-chrome:3000
          BROWSER_CONNECT_ONDEMAND: "true"
          ASSET_STORE_S3_ENDPOINT: https://ps3-global.sphns.run
          ASSET_STORE_S3_REGION: global
          ASSET_STORE_S3_BUCKET: karakeep
          ASSET_STORE_S3_FORCE_PATH_STYLE: "true"
          ASSET_STORE_S3_ACCESS_KEY_ID:
            valueFrom:
              secretKeyRef:
                name: hoarder-access-key
                key: AWS_ACCESS_KEY_ID
          ASSET_STORE_S3_SECRET_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: hoarder-access-key
                key: AWS_SECRET_ACCESS_KEY
          OAUTH_WELLKNOWN_URL: https://auth.sophons.cloud/.well-known/openid-configuration
          OAUTH_CLIENT_ID: sphns_q1F-KFdfxuwpzFejpdac311zzc65t0eiT.X1Vu3mE5
          OAUTH_PROVIDER_NAME: Authelia
          OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
          # 15s
          OAUTH_TIMEOUT: "15000"
          OPENAI_API_KEY: clankerstudio
          # lmstudio on kaos
          OPENAI_BASE_URL: http://100.64.0.26:11433/v1
          INFERENCE_TEXT_MODEL: openai/gpt-oss-20b
          INFERENCE_IMAGE_MODEL: qwen/qwen3-vl-8b
          EMBEDDING_TEXT_MODEL: qwen/qwen3-embedding-4b
          INFERENCE_CONTEXT_LENGTH: "49152"
          INFERENCE_MAX_OUTPUT_TOKENS: "16384"
          INFERENCE_ENABLE_AUTO_TAGGING: "true"
          INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
          # 2.5 minutes
          INFERENCE_JOB_TIMEOUT_SEC: "150"
          CRAWLER_FULL_PAGE_ARCHIVE: "true"
          # 3 minutes
          CRAWLER_JOB_TIMEOUT_SEC: "300"
          CRAWLER_SCREENSHOT_TIMEOUT_SEC: "60"

        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]

    initContainers:
      litestream:
        restartPolicy: Always
        image:
          repository: docker.io/litestream/litestream
          tag: latest # required, replaced
        command: [bash, /etc/litestream/entrypoint.sh]
        envFrom:
          - configMapRef:
              name: litestream-env
          - secretRef:
              name: infinity-and-beyond-access-key
        env:
          - name: GOGC
            value: "10"
          - name: GOMEMLIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.memory
          - name: LITESTREAM_ENDPOINT
            value: https://ps3-global.sphns.run
          - name: LITESTREAM_BUCKET
            value: litestream-ad-infinitum
          - name: LITESTREAM_REPLICA_PATH
            value: ng/karakeep
          - name: LITESTREAM_CONFIG
            value: |-
              dbs:
                - path: /data/db.db
                  replica:
                    url: "[[replica_url db.db]]"
                - path: /data/queue.db
                  replica:
                    url: "[[replica_url queue.db]]"

        ports:
          - name: ls-metrics
            containerPort: 9090

        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: [bash, /etc/litestream/restore-probe.sh]
              initialDelaySeconds: 10
              periodSeconds: 5
              failureThreshold: 30

        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]

        resources:
          requests:
            cpu: 50m
            memory: 48Mi
          limits:
            memory: 100Mi
      tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.98.4
        restartPolicy: Always
        envFrom:
          - configMapRef:
              name: tailscale-config
          - secretRef:
              name: tailscale-auth
        env:
          - name: GOGC
            value: "10"
          - name: GOMEMLIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.memory
          - name: TS_EXTRA_ARGS
            value: $(TS_BASE_ARGS)
          - name: TS_TAILSCALED_EXTRA_ARGS
            value: $(TSD_BASE_ARGS)
          - name: TS_HOSTNAME
            value: karakeep
          - name: TS_USERSPACE
            value: "false"
        ports:
          - name: ts-metrics
            containerPort: 9002

        resources:
          requests:
            cpu: 50m
            memory: 48Mi
          limits:
            memory: 100Mi
            devic.es/tun: 1

        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
            add: [NET_ADMIN]

        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: ts-metrics

          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: ts-metrics
  chrome:
    pod:
      nodeSelector:
        kubernetes.io/hostname: sophons-caeneus
      tolerations:
        - key: caeneus.sophons.cloud
          operator: Exists
    containers:
      chrome:
        # https://github.com/jlandure/alpine-chrome/issues/272#issuecomment-3536582057
        # Can't trust the alpine container :(
        image:
          repository: ghcrd.sphns.run/browserless/chromium
          tag: v2.46.0
        args: null
        env:
          - name: ENABLE_DEBUGGER
            value: false
          - name: TIMEOUT
            # Now 10 minutes
            value: "600000"
          - name: CONCURRENT
            value: "8"
          # - name: TOKEN
          #   value: waososecure
        # args:
        #   # FIXME: CHROME SANDBOX
        #   # - --no-sandbox
        #   - --remote-debugging-address=0.0.0.0
        #   - --remote-debugging-port=9222
        #   - --headless
        #   - --hide-scrollbars
        #   - --disable-gpu
        #   - --disable-dev-shm-usage
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /active
                port: 3000
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /active
                port: 3000
        securityContext:
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
          capabilities:
            add: null
            drop:
              - ALL
              # - SYS_ADMIN
          seccompProfile:
            type: RuntimeDefault
            # seccompProfile:
            #   type: Localhost
            #   localhostProfile: profiles/chrome.json
        resources:
          requests:
            cpu: 100m
          limits:
            cpu: null
service:
  chrome:
    ports:
      http: null
      ws:
        port: 3000
persistence:
  tmp:
    type: emptyDir
    advancedMounts:
      karakeep:
        karakeep:
          - path: /data
            subPath: data
          - path: /tmp
            subPath: karakeep
          - path: /run
            subPath: run
        litestream:
          - path: /data
            subPath: data
          - path: /tmp
            subPath: litestream
        tailscale:
          - path: /tmp
            subPath: tailscale
      chrome:
        chrome:
          - path: /tmp
            subPath: chrome
  litestream-config:
    type: configMap
    name: litestream-config
    advancedMounts:
      karakeep:
        litestream:
          - path: /etc/litestream

meilisearch:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values:
                  - ng
          weight: 100
  auth:
    existingMasterKeySecret: karakeep
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 256Mi
  securityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault
  persistence:
    enabled: false

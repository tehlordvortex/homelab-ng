#
# IMPORTANT NOTE
#
# This chart inherits from the bjw-s library chart. You can check the default values/options here:
# https://github.com/bjw-s/helm-charts/tree/main/charts/library/common
#
applicationProtocol: https
applicationHost: hoarder.sophons.cloud

secrets:
  karakeep:
    enabled: false
  meilesearch:
    enabled: false

ingress:
  karakeep:
    enabled: false

controllers:
  karakeep:
    statefulset:
      volumeClaimTemplates: []
    pod:
      terminationGracePeriodSeconds: 120
      hostUsers: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [sophons-theta, sophons-voltzahl]
              weight: 67
            # - preference:
            #     matchExpressions:
            #       - key: topology.kubernetes.io/region
            #         operator: In
            #         values:
            #           - ng
            #   weight: 100
    containers:
      karakeep:
        image:
          # tag: 0.33.2
          # https://github.com/karakeep-app/karakeep/pull/3009
          tag: latest@sha256:29937372d6615959929522daf77fd27be8d363b67de62b715d1270e9d0589b4c
        # Next.js is a plague :(
        resources:
          requests:
            cpu: 150m
            memory: 300Mi
          limits:
            memory: 1.5Gi

        envFrom:
          - secretRef:
              name: karakeep

        env:
          DISABLE_SIGNUPS: "true"
          DB_WAL_MODE: "true"
          BROWSER_WEB_URL: http://karakeep-chrome:9222
          ASSET_STORE_S3_ENDPOINT: http://s3-global.garage:3900
          ASSET_STORE_S3_REGION: global
          ASSET_STORE_S3_BUCKET: karakeep
          ASSET_STORE_S3_FORCE_PATH_STYLE: "true"
          ASSET_STORE_S3_ACCESS_KEY_ID:
            valueFrom:
              secretKeyRef:
                name: hoarder-access-key
                key: AWS_ACCESS_KEY_ID
          ASSET_STORE_S3_SECRET_ACCESS_KEY:
            valueFrom:
              secretKeyRef:
                name: hoarder-access-key
                key: AWS_SECRET_ACCESS_KEY
          OAUTH_WELLKNOWN_URL: https://auth.sophons.cloud/.well-known/openid-configuration
          OAUTH_CLIENT_ID: sphns_q1F-KFdfxuwpzFejpdac311zzc65t0eiT.X1Vu3mE5
          OAUTH_PROVIDER_NAME: Authelia
          OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
          OAUTH_TIMEOUT: "15000" # 15s
          OPENAI_API_KEY: clankerstudio
          OPENAI_BASE_URL: http://100.64.0.26:11433/v1 # lmstudio on kaos
          OPENAI_PROXY_URL: http://localhost:8080
          OPENAI_REASONING_EFFORT: none
          INFERENCE_NUM_WORKERS: "2"
          INFERENCE_TEXT_MODEL: google/gemma-4-12b-qat
          INFERENCE_IMAGE_MODEL: google/gemma-4-12b-qat
          INFERENCE_CONTEXT_LENGTH: "16384"
          INFERENCE_MAX_OUTPUT_TOKENS: "8192"
          # 2.5 minutes
          INFERENCE_JOB_TIMEOUT_SEC: "150"
          EMBEDDING_NUM_WORKERS: "3"
          EMBEDDING_DIMENSIONS: "768"
          EMBEDDING_TEXT_MODEL: google/embeddinggemma-300m-qat
          EMBEDDING_TEXT_MODEL_DIMENSION_OVERRIDE: "768"
          EMBEDDING_CONTEXT_LENGTH: "3072"
          EMBEDDING_ENABLE_AUTO_INDEXING: "true"
          INFERENCE_ENABLE_AUTO_TAGGING: "true"
          INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
          # turns out its disabled by default for a reason whoopsie
          # CRAWLER_FULL_PAGE_ARCHIVE: "true"
          CRAWLER_NUM_WORKERS: "3"
          # 3 minutes
          CRAWLER_JOB_TIMEOUT_SEC: "300"
          CRAWLER_SCREENSHOT_TIMEOUT_SEC: "45"
          CRAWLER_MONOLITH_TIMEOUT_SEC: "180"
          HTML_CONTENT_SIZE_INLINE_THRESHOLD_BYTES: "1024"
          SEARCH_NUM_WORKERS: "3"
          SEARCH_JOB_TIMEOUT_SEC: "60"
          ASSET_PREPROCESSING_NUM_WORKERS: "3"

          EVENT_LOGS_ENABLED: "true"

        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]

    initContainers:
      0-tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: latest # required, replaced
        restartPolicy: Always
        envFrom:
          - configMapRef:
              name: tailscale-config
          - secretRef:
              name: tailscale-auth
        env:
          - name: GOGC
            value: "10"
          - name: GOMEMLIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.memory
          - name: TS_EXTRA_ARGS
            value: $(TS_BASE_ARGS)
          - name: TS_TAILSCALED_EXTRA_ARGS
            value: $(TSD_BASE_ARGS)
          - name: TS_HOSTNAME
            value: karakeep
          - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
            value: localhost:8080
        ports:
          - name: ts-metrics
            containerPort: 9002

        resources:
          requests:
            cpu: 25m
            memory: 48Mi
          limits:
            memory: 100Mi
            devic.es/tun: 1

        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]

        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: ts-metrics

          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /healthz
                port: ts-metrics

      1-litestream:
        restartPolicy: Always
        image:
          repository: docker.io/litestream/litestream
          tag: latest # required, replaced
        command: [bash, /etc/litestream/entrypoint.sh]
        envFrom:
          - configMapRef:
              name: litestream-env
          - secretRef:
              name: infinity-and-beyond-access-key
        env:
          - name: GOGC
            value: "10"
          - name: GOMEMLIMIT
            valueFrom:
              resourceFieldRef:
                resource: limits.memory
          - name: LITESTREAM_ENDPOINT
            value: http://s3-global.garage:3900
          - name: LITESTREAM_BUCKET
            value: litestream-ad-infinitum
          - name: LITESTREAM_REPLICA_PATH
            value: ng/karakeep
          - name: LITESTREAM_SNAPSHOT_INTERVAL
            value: 24h
          - name: LITESTREAM_RESTORE_EXTRA_ARGS
            value: |-
              -parallelism=32
          - name: LITESTREAM_CONFIG
            value: |-
              shutdown-sync-timeout: 110s
              levels:
                - interval: 15m  # L1
                - interval: 1.5h # L2
                - interval: 6h   # L3

              dbs:
                - path: /data/db.db
                  replica:
                    url: "[[replica_url db.db]]"
                    concurrency: 9
                - path: /data/queue.db
                  replica:
                    url: "[[replica_url queue.db]]"
                    concurrency: 12

        ports:
          - name: ls-metrics
            containerPort: 9090

        probes:
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command: [bash, /etc/litestream/restore-probe.sh]
              initialDelaySeconds: 10
              periodSeconds: 10
              failureThreshold: 30

        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]

        resources:
          requests:
            cpu: 50m
            memory: 48Mi
          limits:
            memory: 100Mi
  chrome:
    pod:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 10.43.45.33 # necros
          - 10.43.14.33 # nomos
      hostUsers: false
      nodeSelector:
        topology.kubernetes.io/region: ng
      tolerations:
        - key: caeneus.sophons.cloud
          operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    containers:
      chrome:
        image:
          repository: ghcr.io/karakeep-app/karakeep-chrome
          tag: 151.0.7922.47-r1
        args:
          - --disable-gpu
          - --disable-dev-shm-usage
          - --disable-blink-features=AutomationControlled
          - --window-size=1440,900
          - --hide-scrollbars
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            add: null
            drop: [ALL]
        resources:
          requests:
            cpu: 100m
          limits:
            cpu: null
            memory: 1Gi
service:
  chrome:
    ports:
      http:
        port: 9222
persistence:
  tmp:
    type: emptyDir
    advancedMounts:
      karakeep:
        karakeep:
          - path: /data
            subPath: data
          - path: /tmp
            subPath: karakeep
          - path: /run
            subPath: run
        0-tailscale:
          - path: /tmp
            subPath: tailscale
        1-litestream:
          - path: /data
            subPath: data
          - path: /tmp
            subPath: litestream
      chrome:
        chrome:
          - path: /tmp
            subPath: chrome
          - path: /var/cache
            subPath: cache
  litestream-config:
    type: configMap
    name: litestream-config
    advancedMounts:
      karakeep:
        1-litestream:
          - path: /etc/litestream

meilisearch:
  # This ties the instance to a node but eh, S3 storage isn't available, and
  # this doesn't worsen our existing SLA (which is **fuck all**)
  nodeSelector:
    kubernetes.io/hostname: sophons-voltzahl

  auth:
    existingMasterKeySecret: karakeep
  environment:
    MEILI_MAX_INDEXING_THREADS: 3
    MEILI_MAX_INDEXING_MEMORY: 200Mi
    MEILI_EXPERIMENTAL_REDUCE_INDEXING_MEMORY_USAGE: true

  resources:
    requests:
      cpu: 50m
      memory: 200Mi
    limits:
      memory: 512Mi

  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault

  persistence:
    enabled: true
    storageClass: local-path

  serviceMonitor:
    enabled: true
    interval: null

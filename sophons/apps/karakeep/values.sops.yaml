# https://github.com/bjw-s/helm-charts/tree/main/charts/library/common
#
applicationProtocol: https
applicationHost: holding.sophons.cloud
# enc!
applicationSecretKey: ENC[AES256_GCM,data:rADuteOF4K2LIR5QfOadtxyPiiT9OW3VxG5zmw/5UAOYt7NMzLsJyOxMoJN4cqkE,iv:7x5TXVkRgmDRcWVMtYJvSIohrLSkE/f2iwQFYifYqec=,tag:YUBD1d4R6L97uxFlMiXjyQ==,type:str]
# enc!
meilisearchMasterKey: ENC[AES256_GCM,data:4gysaSVZ5Sododj/olt57ZXFa/m3PD6Rjr1mRgKM,iv:vg9L8jhdbNTwJ/ipmhYYG61O9TRYbVLYesoIFjvOeNc=,tag:J11syO2vR6iwVnohhXq8aA==,type:str]
ingress:
  karakeep:
    enabled: false
controllers:
  karakeep:
    type: deployment
    strategy: Recreate
    statefulset:
      volumeClaimTemplates: []
    pod:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: In
                    values:
                      - ng
              weight: 100
    containers:
      karakeep:
        image:
          tag: 0.31.0
        # Next.js is a plague :(
        resources:
          requests:
            cpu: 150m
            memory: 300Mi
          limits:
            memory: 756Mi
        envFrom:
          - secretRef:
              name: '{{ .Release.Name }}'
          - secretRef:
              name: '{{ .Release.Name }}-meilesearch'
          - secretRef:
              name: hoarder-access-key
          - secretRef:
              name: karakeep-oauth
        env:
          DISABLE_SIGNUPS: "true"
          DB_WAL_MODE: "true"
          BROWSER_WEB_URL: null
          BROWSER_WEBSOCKET_URL: ws://{{ .Release.Name }}-chrome:3000
          ASSET_STORE_S3_ENDPOINT: https://ps3-global.sphns.run
          ASSET_STORE_S3_REGION: global
          ASSET_STORE_S3_BUCKET: karakeep
          ASSET_STORE_S3_FORCE_PATH_STYLE: "true"
          OAUTH_WELLKNOWN_URL: https://auth.sophons.cloud/.well-known/openid-configuration
          OAUTH_CLIENT_ID: sphns_q1F-KFdfxuwpzFejpdac311zzc65t0eiT.X1Vu3mE5
          OAUTH_PROVIDER_NAME: Authelia
          OAUTH_ALLOW_DANGEROUS_EMAIL_ACCOUNT_LINKING: "true"
          # 15s
          OAUTH_TIMEOUT: "15000"
          OPENAI_API_KEY: clankerstudio
          # lmstudio on kaos
          OPENAI_BASE_URL: http://100.64.0.26:11433/v1
          INFERENCE_TEXT_MODEL: openai/gpt-oss-20b
          INFERENCE_IMAGE_MODEL: qwen/qwen3-vl-8b
          EMBEDDING_TEXT_MODEL: qwen/qwen3-embedding-4b
          INFERENCE_CONTEXT_LENGTH: "49152"
          INFERENCE_MAX_OUTPUT_TOKENS: "16384"
          INFERENCE_ENABLE_AUTO_TAGGING: "true"
          INFERENCE_ENABLE_AUTO_SUMMARIZATION: "true"
          # 2.5 minutes
          INFERENCE_JOB_TIMEOUT_SEC: "150"
          CRAWLER_FULL_PAGE_ARCHIVE: "true"
          # 3 minutes
          CRAWLER_JOB_TIMEOUT_SEC: "300"
          CRAWLER_SCREENSHOT_TIMEOUT_SEC: "60"
    initContainers:
      00-litestream-legacy-restore-db:
        image:
          repository: docker.io/litestream/litestream
          tag: 0.3.13
        args:
          - restore
          - -config=/etc/litestream/litestream-legacy.yaml
          - /data/db.db
        envFrom:
          - secretRef:
              name: litestream-ps3-global-access-key
        env:
          - name: GOMEMLIMIT
            value: 120MiB
          - name: LITESTREAM_LOGGING_LEVEL
            value: debug
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 128Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
      01-litestream-legacy-restore-queue:
        image:
          repository: docker.io/litestream/litestream
          tag: 0.3.13
        args:
          - restore
          - -config=/etc/litestream/litestream-legacy.yaml
          - /data/queue.db
        envFrom:
          - secretRef:
              name: litestream-ps3-global-access-key
        env:
          - name: GOMEMLIMIT
            value: 120MiB
          - name: LITESTREAM_LOGGING_LEVEL
            value: debug
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 128Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
      02-litestream-legacy-replicate:
        image:
          repository: docker.io/litestream/litestream
          tag: 0.3.13
        restartPolicy: Always
        args:
          - replicate
          - -config=/etc/litestream/litestream-legacy.yaml
        ports:
          - name: metrics
            containerPort: 9090
        envFrom:
          - secretRef:
              name: litestream-ps3-global-access-key
        env:
          - name: GOMEMLIMIT
            value: 120MiB
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            memory: 128Mi
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
      03-tailscale:
        image:
          repository: ghcr.io/tailscale/tailscale
          tag: v1.94.2
        restartPolicy: Always
        envFrom:
          - secretRef:
              name: tailscale-base-config
          - secretRef:
              name: tailscale-ephemeral-auth
        env:
          - name: TS_EXTRA_ARGS
            value: $(TS_BASE_ARGS)
          - name: TS_TAILSCALED_EXTRA_ARGS
            value: $(TSD_BASE_ARGS)
          - name: TS_HOSTNAME
            value: karakeep
          - name: TS_USERSPACE
            value: "false"
        ports:
          - name: ts-metrics
            containerPort: 9002
        securityContext:
          privileged: true
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        liveness:
          enabled: true
          spec:
            initialDelaySeconds: 10
            httpGet:
              path: /healthz
              port: 9002
        readiness:
          enabled: true
          spec:
            initialDelaySeconds: 10
            httpGet:
              path: /healthz
              port: 9002
  chrome:
    pod:
      nodeSelector:
        kubernetes.io/hostname: sophons-caeneus
      tolerations:
        - key: caeneus.sophons.cloud
          operator: Exists
    containers:
      chrome:
        # https://github.com/jlandure/alpine-chrome/issues/272#issuecomment-3536582057
        # Can't trust the alpine container :(
        image:
          repository: ghcr.io/browserless/chromium
          tag: v2.42.0
        args: null
        # args:
        #   # FIXME: CHROME SANDBOX
        #   # - --no-sandbox
        #   - --remote-debugging-address=0.0.0.0
        #   - --remote-debugging-port=9222
        #   - --headless
        #   - --hide-scrollbars
        #   - --disable-gpu
        #   - --disable-dev-shm-usage
        probes:
          liveness:
            enabled: true
            spec:
              httpGet:
                path: /
                port: 3000
          readiness:
            enabled: true
            spec:
              httpGet:
                path: /
                port: 3000
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            add: null
            drop:
              - ALL
              # - SYS_ADMIN
          seccompProfile:
            type: RuntimeDefault
            # seccompProfile:
            #   type: Localhost
            #   localhostProfile: profiles/chrome.json
        resources:
          requests:
            cpu: 100m
          limits:
            cpu: null
service:
  chrome:
    ports:
      http: null
      ws:
        port: 3000
persistence:
  data:
    type: emptyDir
    advancedMounts:
      karakeep:
        karakeep:
          - path: /data
        00-litestream-legacy-restore-db:
          - path: /data
        01-litestream-legacy-restore-queue:
          - path: /data
        02-litestream-legacy-replicate:
          - path: /data
  chrome-tmp:
    type: emptyDir
    advancedMounts:
      chrome:
        chrome:
          - path: /tmp
  chrome-home:
    type: emptyDir
    advancedMounts:
      chrome:
        chrome:
          - path: /home/chrome
  litestream:
    type: configMap
    name: litestream
    advancedMounts:
      karakeep:
        00-litestream-legacy-restore-db:
          - path: /etc/litestream
        01-litestream-legacy-restore-queue:
          - path: /etc/litestream
        02-litestream-legacy-replicate:
          - path: /etc/litestream
meilisearch:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values:
                  - ng
          weight: 100
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 256Mi
  persistence:
    existingClaim: karakeep-meilisearch

# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.34.1/service.json
apiVersion: v1
kind: Service
metadata:
  name: necronomicon
  namespace: pihole
  labels:
    app.kubernetes.io/instance: necronomicon
  annotations:
    metallb.io/address-pool: internal
spec:
  type: LoadBalancer
  loadBalancerClass: io.metallb
  ports:
    - name: dns-tcp
      port: 53
      protocol: TCP
      targetPort: dns-tcp
    - name: dns-udp
      port: 53
      protocol: UDP
      targetPort: dns-udp
  selector:
    app.kubernetes.io/instance: necronomicon

resources:
  - ../instance

patches:
  - target:
      kind: Service
      name: necronomicon
    patch: |-
      - op: replace
        path: /metadata/name
        value: nomos
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1instance
        value: nomos
      - op: replace
        path: /spec/selector/app.kubernetes.io~1instance
        value: nomos
  - target:
      kind: StatefulSet
      name: necronomicon
    patch: |-
      - op: replace
        path: /metadata/name
        value: nomos
      - op: replace
        path: /metadata/labels/app.kubernetes.io~1instance
        value: nomos
      - op: replace
        path: /spec/selector/matchLabels/app.kubernetes.io~1instance
        value: nomos
      - op: replace
        path: /spec/template/metadata/labels/app.kubernetes.io~1instance
        value: nomos
      - op: add
        path: /spec/template/spec/affinity/nodeAffinity/preferredDuringSchedulingIgnoredDuringExecution/-
        value:
          preference:
            matchExpressions:
              - key: topology.kubernetes.io/region
                operator: NotIn
                values: [ng]
          weight: 100
      - op: add
        path: /spec/template/spec/initContainers/1/env/-
        value:
          name: TS_HOSTNAME
          value: nomos
      - op: add
        path: /spec/template/spec/initContainers/1/env/-
        value:
          name: TS_KUBE_SECRET
          value: nomos

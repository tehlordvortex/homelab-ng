namespace: weed-system
resources:
  - resources.yaml # generated by kustomizer

patches:
  - target:
      kind: DaemonSet
      name: weedfs-csi-driver-mount
    patch: |
      kind: DaemonSet
      metadata:
        name: weedfs-csi-driver-mount
      spec:
        template:
          spec:
            containers:
              - name: seaweedfs-mount
                env:
                  - name: GOMEMLIMIT
                    valueFrom:
                      resourceFieldRef:
                        resource: limits.memory
  - target:
      kind: DaemonSet
      name: weedfs-csi-driver-node
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DATA_CENTER
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['topology.kubernetes.io/zone']
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "-dataCenter=$(DATA_CENTER)"

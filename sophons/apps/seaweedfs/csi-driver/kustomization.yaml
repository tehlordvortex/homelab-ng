namespace: weed-system
resources:
  - resources.yaml # generated by kustomizer

patches:
  - target:
      kind: DaemonSet
      name: weedfs-csi-driver-mount
    patch: |
      kind: DaemonSet
      metadata:
        name: weedfs-csi-driver-mount
      spec:
        template:
          spec:
            volumes:
              - name: cache
                emptyDir: null
                hostPath:
                  path: /var/lib/garage/weedfs/cache
            containers:
              - name: seaweedfs-mount
                env:
                  - name: GOGC
                    value: "25"
                  - name: GOMEMLIMIT
                    value: 256MiB

  - target:
      kind: DaemonSet
      name: weedfs-csi-driver-node
    patch: |
      kind: DaemonSet
      metadata:
        name: weedfs-csi-driver-node
      spec:
        template:
          spec:
            volumes:
              - name: cache
                emptyDir: null
                hostPath:
                  path: /var/lib/garage/weedfs/cache
            containers:
              - name: csi-seaweedfs-plugin
                env:
                  - name: GOGC
                    value: "25"
                  - name: GOMEMLIMIT
                    valueFrom:
                      resourceFieldRef:
                        resource: limits.memory

  - target:
      kind: DaemonSet
      name: weedfs-csi-driver-node
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DATA_CENTER
          valueFrom:
            fieldRef:
              fieldPath: metadata.labels['topology.kubernetes.io/region']
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: "-dataCenter=$(DATA_CENTER)"

global:
  seaweedfs:
    monitoring:
      enabled: true
    enableReplication: true
    replicationPlacement: "100"

admin:
  enabled: true
  port: 23646
  grpcPort: 33646 # For worker connections

  logs:
    type: null

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

  containerSecurityContext:
    enabled: true
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  extraEnvironmentVars:
    GOGC: "10"
    GOMEMLIMIT:
      resourceFieldRef:
        resource: limits.memory

master:
  nodeSelector: |
    weed.sophons.cloud/cluster: global
    weed.sophons.cloud/master: "true"
  priorityClassName: system-cluster-critical
  volumeSizeLimitMB: 512
  data:
    type: emptyDir
  logs:
    type: null

  resources:
    requests:
      cpu: 75m
      memory: 64Mi
    limits:
      memory: 200Mi

  containerSecurityContext:
    enabled: true
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  extraEnvironmentVars:
    GOGC: "50"
    GOMEMLIMIT:
      resourceFieldRef:
        resource: limits.memory

    WEED_MASTER_VOLUME_GROWTH_COPY_1: "1"
    WEED_MASTER_VOLUME_GROWTH_COPY_2: "1"
    WEED_MASTER_VOLUME_GROWTH_COPY_3: "1"
    WEED_MASTER_VOLUME_GROWTH_COPY_OTHER: "1"

volume:
  enabled: true
  rust: true # what's the worst that could go wrong
  replicas: 3
  priorityClassName: system-node-critical

  nodeSelector: |
    weed.sophons.cloud/cluster: global
    weed.sophons.cloud/volume: "true"

  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: seaweedfs
              app.kubernetes.io/instance: weedfs
              app.kubernetes.io/component: volume
          matchLabelKeys: [controller-revision-hash]
          topologyKey: "kubernetes.io/hostname"

  topologySpreadConstraints: |
    - labelSelector:
        matchLabels:
          app.kubernetes.io/name: seaweedfs
          app.kubernetes.io/instance: weedfs
          app.kubernetes.io/component: volume
      maxSkew: 1
      minDomains: 3
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - labelSelector:
        matchLabels:
          app.kubernetes.io/name: seaweedfs
          app.kubernetes.io/instance: weedfs
          app.kubernetes.io/component: volume
      maxSkew: 1
      minDomains: 3
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

  readMode: redirect
  dataDirs:
    - name: data-uno
      type: persistentVolumeClaim
      storageClass: local-path
      size: 32Gi
      maxVolumes: 64

  idx:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 4Gi

  logs: null

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi

  extraEnvironmentVars:
    GOGC: "30"
    GOMEMLIMIT: 500MiB
    DATA_CENTER:
      fieldRef:
        fieldPath: metadata.labels['topology.kubernetes.io/zone']
  extraArgs:
    - -dataCenter=$(DATA_CENTER)

  containerSecurityContext:
    enabled: true
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: Always
    seccompProfile:
      type: RuntimeDefault

filer:
  loggingOverrideLevel: 0 # noisy filer generates data for logs/metrics, which generates logs in filer, which...
  replicas: 3
  priorityClassName: system-node-critical
  nodeSelector: |
    weed.sophons.cloud/cluster: global
    weed.sophons.cloud/filer: "true"
  topologySpreadConstraints: |
    - labelSelector:
        matchLabels:
          app.kubernetes.io/name: seaweedfs
          app.kubernetes.io/instance: weedfs
          app.kubernetes.io/component: filer
      maxSkew: 1
      minDomains: 3
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
    - labelSelector:
        matchLabels:
          app.kubernetes.io/name: seaweedfs
          app.kubernetes.io/instance: weedfs
          app.kubernetes.io/component: filer
      maxSkew: 1
      minDomains: 3
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule

  extraVolumes: |
    - name: tmp
      emptyDir: {}
  extraVolumeMounts: |
    - name: tmp
      mountPath: /tmp

  data:
    type: persistentVolumeClaim
    storageClass: local-path
    size: 8Gi

  logs:
    type: null

  s3:
    enabled: true
    enableAuth: true
    existingConfigSecret: weed-s3

    createBuckets:
      - name: monitoring

  resources:
    requests:
      cpu: 100m
      memory: 172Mi
    limits:
      memory: 564Mi

  extraEnvironmentVars:
    GOGC: "10"
    GOMEMLIMIT: 550MiB
    DATA_CENTER:
      fieldRef:
        fieldPath: metadata.labels['topology.kubernetes.io/zone']
  extraArgs:
    - -dataCenter=$(DATA_CENTER)

  containerSecurityContext:
    enabled: true
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: Always
    seccompProfile:
      type: RuntimeDefault

s3:
  enabled: false
  enableAuth: true
  existingConfigSecret: weed-s3
  priorityClassName: system-cluster-critical

  logs:
    type: null
  replicas: 7
  tolerations: |
    - operator: Exists

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 100Mi

  extraVolumes: |
    - name: tmp
      emptyDir: {}
  extraVolumeMounts: |
    - name: tmp
      mountPath: /tmp

  extraEnvironmentVars:
    GOMEMLIMIT:
      resourceFieldRef:
        resource: limits.memory

  topologySpreadConstraints: |
    - labelSelector:
        matchLabels:
          app.kubernetes.io/weedname: seaweedfs
          app.kubernetes.io/instance: weedfs
          app.kubernetes.io/component: s3
      maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule

  containerSecurityContext:
    enabled: true
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: Always
    seccompProfile:
      type: RuntimeDefault

worker:
  enabled: true

  affinity: |
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [sophons-voltzahl]
          weight: 100
        - preference:
            matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values: [de, nl]
          weight: 80

  jobType: all
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 512Mi

  extraEnvironmentVars:
    GOGC: "25"
    GOMEMLIMIT:
      resourceFieldRef:
        resource: limits.memory

  containerSecurityContext:
    enabled: true
    privileged: false
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

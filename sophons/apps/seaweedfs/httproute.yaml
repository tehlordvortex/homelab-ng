apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weedfs-admin
  namespace: weed-system
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure

  hostnames:
    - weed.sophons.cloud

  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: forwardauth-authelia
      backendRefs:
        - name: weedfs-seaweedfs-admin
          port: 23646

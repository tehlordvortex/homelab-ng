namespace: weed-system
resources:
  - resources.yaml # generated by kustomizer
  - job.yaml
  - service.yaml
  - cfdtunnel.yaml
  - httproute.yaml
  - middleware.yaml
  - dnsendpoint.yaml
  - traefikservice.yaml
  - poddisruptionbudget.yaml
  # - storageclass.yaml # managed seperately

secretGenerator:
  - name: weed-s3
    files:
      - seaweedfs_s3_config=config/s3.sops.json
  - name: weed-s3-access-key
    options:
      disableNameSuffixHash: true
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "monitoring-system"
    env: .env

configMapGenerator:
  - name: weed-filer
    options:
      disableNameSuffixHash: true
    files:
      - filer.conf=config/filer.json

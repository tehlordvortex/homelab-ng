persistence:
  config:
    storageClass: local-path
  media:
    existingClaim: neptune-jellyfin-media
  cache:
    enabled: true
    storageClass: local-path

volumes:
  - name: tmp
    emptyDir: {}
  - name: numedia
    persistentVolumeClaim:
      claimName: neptune-jellyfin-numedia
  - name: hwa-kfd
    hostPath:
      type: CharDevice
      path: /dev/kfd
  - name: hwa-card
    hostPath:
      type: CharDevice
      path: /dev/dri/card2
  - name: hwa-render
    hostPath:
      type: CharDevice
      path: /dev/dri/renderD129

volumeMounts:
  - name: tmp
    mountPath: /tmp
  - name: numedia
    mountPath: /numedia
  - name: hwa-kfd
    mountPath: /dev/kfd
  - name: hwa-card
    mountPath: /dev/dri/card2
  - name: hwa-render
    mountPath: /dev/dri/renderD129

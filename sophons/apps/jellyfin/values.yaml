image:
  tag: "12.0"

httpRoute:
  enabled: true
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Media Server
    gethomepage.dev/group: Media
    gethomepage.dev/icon: jellyfin.svg
    gethomepage.dev/name: Jellyfin
    gethomepage.dev/app: jellyfin

  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure

  hostnames:
    - neptune.sophons.cloud

nodeSelector:
  kubernetes.io/hostname: sophons-caeneus
tolerations:
  - key: caeneus.sophons.cloud
    operator: Exists

resources:
  requests:
    cpu: 150m
    memory: 512Mi
  limits:
    memory: 1.5Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
    add: [SYS_ADMIN]


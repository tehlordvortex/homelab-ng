namespace: headscale
labels:
  - pairs:
      app.kubernetes.io/name: headscale
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/version: 0.28.1
    includeTemplates: true

resources:
  - service.yaml
  - statefulset.yaml
  - dnsendpoint.yaml
  - ../garage/access-keys/infinity-and-beyond
components:
  - ../../common/litestream
  - ../../common/litestream/templ-config

secretGenerator:
  - name: headscale
    env: .env

configMapGenerator:
  - name: headscale
    files:
      - config/headscale.yaml
      - config/headplane.yaml

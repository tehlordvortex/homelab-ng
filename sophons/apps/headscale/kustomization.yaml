apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headscale
labels:
  - pairs:
      app.kubernetes.io/name: headscale
    includeSelectors: true
    includeTemplates: true
  - pairs:
      app.kubernetes.io/version: 0.29.3
    includeTemplates: true

resources:
  - service.yaml
  - httproute.yaml
  - grpcroute.yaml
  - statefulset.yaml
  - dnsendpoint.yaml
  - ../garage/access-keys/infinity-and-beyond
components:
  - ../../common/litestream
  - ../../common/litestream/templ-config

secretGenerator:
  - name: headscale
    envs: [.env]

configMapGenerator:
  - name: headscale
    files:
      - config/headscale.yaml
      - config/headplane.yaml

apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: headscale
  namespace: headscale
spec:
  endpoints:
    - dnsName: hs.vrtx.sh
      recordType: CNAME
      targets: [traefik.noproxy.lb.sphns.run]
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"

namespace: authelia
resources:
  - cfdtunnel.yaml
  - httproute.yaml
  - middleware.yaml
  - secret.sops.yaml

configMapGenerator:
  - name: authelia-users
    options:
      disableNameSuffixHash: true
    files:
      - users.yaml=config/users.sops.yaml
  - name: litestream
    options:
      disableNameSuffixHash: true
    files:
      - config/litestream.yaml
      - config/litestream-legacy.yaml

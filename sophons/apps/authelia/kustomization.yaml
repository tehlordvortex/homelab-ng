namespace: authelia
resources:
  - resources.yaml # generated by kustomizer
  - cfdtunnel.yaml
  - httproute.yaml
  - dragonfly.yaml
  - middleware.yaml
  - secret.sops.yaml

configMapGenerator:
  - name: authelia-users
    files:
      - users.yaml=config/users.sops.yaml
  - name: litestream
    files:
      - config/litestream.yaml
      - config/litestream-legacy.yaml

namespace: authelia
resources:
  - resources.yaml # generated by kustomizer
  - cfdtunnel.yaml
  - httproute.yaml
  - middleware.yaml
  - secret.sops.yaml
  - ../../common/litestream
  - ../../common/litestream/watch-config
  - ../garage/access-keys/infinity-and-beyond

configMapGenerator:
  - name: authelia-users
    options:
      disableNameSuffixHash: true
    files:
      - users.yaml=config/users.sops.yaml
  - name: litestream
    files:
      - config/litestream.yaml
      - config/litestream-legacy.yaml

# yaml-language-server: $schema=https://raw.githubusercontent.com/nlamirault/schema-hub/main/schemas/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: authelia
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/description: Authzzz
    gethomepage.dev/group: Admin
    gethomepage.dev/icon: authelia.svg
    gethomepage.dev/name: Authelia
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure

  hostnames:
    - auth.sophons.cloud
    - auth.vrtx.sh
    - auth.kaos.nexus

  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/openid-configuration
          method: HEAD
        - path:
            type: Exact
            value: /.well-known/openid-configuration
          method: GET
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: static-well-known-openid-configuration
    - matches:
        - path:
            type: Exact
            value: /jwks.json
          method: HEAD
        - path:
            type: Exact
            value: /jwks.json
          method: GET
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: static-jwks-json
    - backendRefs:
        - name: authelia
          port: 80

          emptyDir: {}
        - name: seaweedfs-cache
          hostPath:
            path: /var/lib/garage/weedfs/cache
        - name: config
          configMap:
            name: mimir-config
        - name: runtime-config
          configMap:
            name: mimir-runtime-config

      containers:
        - name: mimir
          image: docker.io/grafana/mimir
          # image: registry.k8s.io/pause:3.9
          args:
            - -config.file=/etc/mimir/mimir.yaml
            - -compactor.cleanup-interval=5m
          env:
            - name: GOGC
              value: "5"
            - name: GOMEMLIMIT
              value: 2048MiB
          envFrom:
            - secretRef:
                name: weed-s3-access-key

          ports:
            - containerPort: 9009
              protocol: TCP
              name: prometheus

          livenessProbe:
            httpGet:
              path: /
              port: prometheus
            timeoutSeconds: 5
            initialDelaySeconds: 15
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /ready
              port: prometheus
            timeoutSeconds: 5
            initialDelaySeconds: 10

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]

          volumeMounts:
            - name: config
              mountPath: /etc/mimir
              readOnly: true
            - name: runtime-config
              mountPath: /etc/mimir/runtime
              readOnly: true
            - name: tmp
              subPath: data
              mountPath: /data # YOLO
              # mountPropagation: HostToContainer
            - name: tmp
              mountPath: /tmp
              subPath: mimir

          resources:
            requests:
              cpu: 500m
              memory: 1.5Gi
            limits:
              memory: 3Gi

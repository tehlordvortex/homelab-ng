# TODO: helm support for http streaming
config: |
  stream_over_http_enabled: true
  memberlist:
    cluster_label: "{{ .Release.Name }}.{{ .Release.Namespace }}"
  multitenancy_enabled: {{ .Values.tempo.multitenancyEnabled }}
  usage_report:
    reporting_enabled: {{ .Values.tempo.reportingEnabled }}
  compactor:
    compaction:
      block_retention: {{ .Values.tempo.retention }}
  distributor:
    receivers:
      {{- toYaml .Values.tempo.receivers | nindent 8 }}
  ingester:
    {{- toYaml .Values.tempo.ingester | nindent 6 }}
  server:
    {{- toYaml .Values.tempo.server | nindent 6 }}
  storage:
    {{- toYaml .Values.tempo.storage | nindent 6 }}
  querier:
    {{- toYaml .Values.tempo.querier | nindent 6 }}
  query_frontend:
    {{- toYaml .Values.tempo.queryFrontend | nindent 6 }}
  overrides:
    {{- toYaml .Values.tempo.overrides | nindent 6 }}
    {{- if .Values.tempo.metricsGenerator.enabled }}
  metrics_generator:
    {{- if .Values.tempo.metricsGenerator.processor }}
    processor:
      {{- toYaml .Values.tempo.metricsGenerator.processor | nindent 8 }}
    {{- end }}
    {{- if .Values.tempo.metricsGenerator.registry }}
    registry:
      {{- toYaml .Values.tempo.metricsGenerator.registry | nindent 8 }}
    {{- end }}
    storage:
      path: {{ .Values.tempo.metricsGenerator.storage.path | quote }}
      {{- if .Values.tempo.metricsGenerator.storage.remote_write }}
      remote_write:
        {{- toYaml .Values.tempo.metricsGenerator.storage.remote_write | nindent 10 }}
      {{- else }}
      remote_write:
        - url: {{ .Values.tempo.metricsGenerator.remoteWriteUrl }}
      {{- end }}
    traces_storage:
      path: {{ .Values.tempo.metricsGenerator.traces_storage.path | quote }}
    {{- end }}

tempo:
  tag: 2.10.5
  resources:
    requests:
      cpu: 150m
      memory: 256Mi
    limits:
      memory: 1Gi
  extraEnv:
    - name: GOGC
      value: "10"
    - name: GOMEMLIMIT
      value: 1000MiB
  extraEnvFrom:
    - secretRef:
        name: weed-s3-access-key
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
    seccompProfile:
      type: RuntimeDefault

  memBallastSizeMbs: 0
  reportingEnabled: false
  multitenancyEnabled: false
  retention: 24h

  metricsGenerator:
    enabled: true
    remoteWriteUrl: http://mimir-mirage:9009/api/v1/push
    storage:
      path: /tmp/tempo/blocks
    traces_storage:
      path: /tmp/tempo/traces

  querier:
    trace_by_id:
      query_timeout: 30s
    search:
      query_timeout: 60s
  storage:
    trace:
      backend: s3
      s3:
        bucket: monitoring
        prefix: tempo/
        endpoint: ps3-weed.sphns.run
        forcepathstyle: true
        enable_dual_stack: true
      wal:
        path: /tmp/tempo/wal
  extraVolumeMounts:
    - mountPath: /tmp
      name: tmp

persistence:
  enabled: false
priorityClassName: system-node-critical
tolerations:
  - key: caeneus.sophons.cloud
    operator: Exists
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: topology.kubernetes.io/region
              operator: In
              values:
                - ng
                - de

serviceMonitor:
  enabled: true

extraVolumes:
  - name: tmp
    emptyDir: {}

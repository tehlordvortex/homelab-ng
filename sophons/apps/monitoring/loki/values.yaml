# yaml-language-server: $schema=https://github.com/grafana-community/helm-charts/raw/refs/heads/main/charts/loki/values.schema.json
loki:
  auth_enabled: false
  commonConfig:
    path_prefix: /tmp/loki
    replication_factor: 1
  rulerConfig:
    wal:
      dir: /tmp/loki/ruler-wal
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  ingester:
    chunk_encoding: lz4
  tracing:
    enabled: true
  querier:
    # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
    max_concurrent: 2

  compactor:
    retention_enabled: true
    retention_delete_delay: 1h
    delete_request_store: s3

  limits_config:
    retention_period: 120h # 5 days

  storage:
    type: s3
    s3:
      endpoint: https://ps3-weed.sphns.run
      s3ForcePathStyle: true
      disable_dualstack: false
    bucketNames:
      chunks: monitoring
      ruler: monitoring
  storage_config:
    object_prefix: loki/

gateway:
  enabled: false

deploymentMode: SingleBinary
singleBinary:
  extraArgs:
    - -log.level=debug
  terminationGracePeriodSeconds: 120

  replicas: 1

  tolerations:
    - key: caeneus.sophons.cloud
      operator: Exists
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/region
                operator: In
                values:
                  - ng
                  - de

  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 150m
      memory: 128Mi
  extraEnv:
    - name: GOGC
      value: "5"
    - name: GOMEMLIMIT
      value: 500MiB
  extraEnvFrom:
    - secretRef:
        name: weed-s3-access-key

  persistence:
    enabled: false

lokiCanary:
  kind: Deployment
  replicas: 2

  tolerations:
    - key: caeneus.sophons.cloud
      operator: Exists
  nodeSelector:
    topology.kubernetes.io/region: ng
  topologySpreadConstraints:
    - labelSelector:
        matchLabels:
          app.kubernetes.io/component: canary
          app.kubernetes.io/instance: loki
          app.kubernetes.io/name: loki
      maxSkew: 1
      minDomains: 2
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi
  extraEnv:
    - name: GOGC
      value: "5"
    - name: GOMEMLIMIT
      value: 30MiB

chunksCache:
  enabled: false
  # default is 500MB, with limited memory keep this smaller
  writebackSizeLimit: 10MB

resultsCache:
  enabled: false

monitoring:
  dashboards:
    enabled: true
  rules:
    enabled: true
  serviceMonitor:
    enabled: true

# Zero out replica counts of other deployment modes
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

minio:
  enabled: false

# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.35.2/deployment-apps-v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: promstack
  namespace: monitoring-system
spec:
  replicas: 1
  selector: {}
  template:
    spec:
      tolerations:
        - key: caeneus.sophons.cloud
          operator: Exists
      nodeSelector:
        kubernetes.io/hostname: sophons-caeneus

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: thanos-query
                    app.kubernetes.io/instance: promstack
                topologyKey: kubernetes.io/hostname
                matchLabelKeys: [pod-template-hash]
              weight: 100

      containers:
        - args:
            - query
            - --grpc-address=0.0.0.0:10901
            - --http-address=0.0.0.0:9090
            - --log.level=info
            - --log.format=logfmt
            # - --query.replica-label=prometheus_replica
            # - --query.replica-label=rule_replica
            - --endpoint=dnssrv+_grpc._tcp.promstack-thanos-discovery.monitoring-system.svc.cluster.local
            - --endpoint=dnssrv+_grpc._tcp.promstack-thanos-store.monitoring-system.svc.cluster.local
            - --query.timeout=5m
            - --query.lookback-delta=15m
            - --query.auto-downsampling
          env:
            - name: HOST_IP_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          image: quay.io/thanos/thanos
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 4
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
          name: thanos-query

          ports:
            - containerPort: 10901
              name: grpc
            - containerPort: 9090
              name: http

          readinessProbe:
            failureThreshold: 20
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault

          terminationMessagePolicy: FallbackToLogsOnError

      securityContext:
        fsGroup: 65534
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault

      terminationGracePeriodSeconds: 120

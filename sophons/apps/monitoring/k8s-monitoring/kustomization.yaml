namespace: monitoring-system
resources:
  - resources.yaml # generated by kustomizer
  - ciliumlocalredirectpolicy.yaml

patches:
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: zero-order-alloy-operator
        namespace: monitoring-system
      spec:
        template:
          spec:
            containers:
              - name: alloy-operator
                env:
                  - name: GOGC
                    value: "25"
                  - name: GOMEMLIMIT
                    valueFrom:
                      resourceFieldRef:
                        resource: limits.memory

  #       runAsGroup: 65534
  #       allowPrivilegeEscalation: false
  #       capabilities:
  #         drop: [ALL]
  #       seccompProfile:
  #         type: RuntimeDefault

alloy-operator:
  waitForAlloyRemoval:
    enabled: false # enable if needed

  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 128Mi

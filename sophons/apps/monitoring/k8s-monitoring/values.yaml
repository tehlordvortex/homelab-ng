# yaml-language-server: $schema=https://github.com/grafana/k8s-monitoring-helm/raw/refs/tags/k8s-monitoring-4.4.0/charts/k8s-monitoring/values.schema.json
cluster:
  name: sophons

global:
  scrapeInterval: 15s

destinations:
  mimir-mirage:
    type: prometheus
    url: http://mimir-mirage:9009/api/v1/push
  lady-loki:
    type: loki
    url: http://lady-loki:3100/loki/api/v1/push
  tempo-temporium:
    type: otlp
    url: http://tempo-temporium:4317
    protocol: grpc
    tls:
      insecure: true
    traces: { enabled: true }
    metrics: { enabled: false }
    logs: { enabled: false }

podLogsViaLoki:
  enabled: true
  collector: pureblood
  gatherMethod: volumes

nodeLogs:
  enabled: false

applicationObservability:
  enabled: true
  collector: alloy
  receivers:
    otlp:
      grpc:
        enabled: true
      http:
        enabled: true

clusterMetrics:
  enabled: true
  collector: alloy
  controlPlane:
    enabled: true

  kubelet:
    jobLabel: kubelet
  kubeletResource:
    jobLabel: kubelet
    extraMetricProcessingRules: |-
      rule {
        target_label  = "metrics_path"
        replacement   = "/metrics/resources"
      }
  cadvisor:
    jobLabel: kubelet
    extraMetricProcessingRules: |-
      rule {
        target_label  = "metrics_path"
        replacement   = "/metrics/cadvisor"
      }

  apiServer:
    jobLabel: apiserver

  kubeDNS:
    jobLabel: kube-dns

  kube-state-metrics:
    jobLabel: kube-state-metrics

clusterEvents:
  enabled: true
  collector: alloy

hostMetrics:
  enabled: true
  collector: alloy

  linuxHosts:
    enabled: true
    jobLabel: "node-exporter"

prometheusOperatorObjects:
  enabled: true
  collector: alloy

telemetryServices:
  node-exporter:
    deploy: true

  kube-state-metrics:
    deploy: true

    priorityClassName: system-node-critical
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
                - key: topology.kubernetes.io/region
                  operator: NotIn
                  values: [ng]
            weight: 100
    # tolerations:
    #   - key: caeneus.sophons.cloud
    #     operator: Exists
    # nodeSelector:
    #   topology.kubernetes.io/region: ng

integrations:
  collector: alloy
  alloy:
    instances:
      - name: alloy
        namespaces: [monitoring-system]
        labelSelectors:
          app.kubernetes.io/instance: zero-order-alloy

  etcd:
    instances:
      - name: etcd
        namespaces: [kube-system]
        labelSelectors:
          k8s-app: kube-controller-manager # Fix selector for kube-etcd for Talos (set itentionally to kube-controller-manager because all master nodes has the same roles)

  cert-manager:
    instances:
      - name: cert-manager
        namespaces: [cert-manager]
        labelSelectors:
          app.kubernetes.io/name: cert-manager

  grafana:
    instances:
      - name: grafana
        namespaces: [monitoring-system]
        labelSelectors:
          app.kubernetes.io/name: grafana

collectors:
  alloy:
    presets: [statefulset, clustered]
    # liveDebugging:
    #   enabled: true

    controller:
      replicas: 3
      priorityClassName: system-cluster-critical
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
              app.kubernetes.io/instance: zero-order-alloy
          maxSkew: 1
          minDomains: 3
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - preference:
                matchExpressions:
                  - key: topology.kubernetes.io/region
                    operator: NotIn
                    values: [ng]
              weight: 100

    alloy:
      clustering:
        enabled: true
      resources:
        requests:
          cpu: 150m
          memory: 350Mi
        limits:
          memory: 600Mi
      extraEnv:
        - name: GOGC
          value: "5"
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.memory

      livenessProbe:
        httpGet:
          path: /metrics
          port: 12345
          scheme: HTTP
        # initialDelaySeconds: 15
        # failureThreshold: 5
        # timeoutSeconds: 5
      # timeoutSeconds: 5 # readiness probe
      enableReporting: false

    configReloader:
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 64Mi
      customArgs:
        - --watched-dir=/etc/alloy
        - --reload-url=http://localhost:12345/-/reload
        # - --reload-timeout=45s
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault

  pureblood:
    presets: [filesystem-log-reader, daemonset]
    # liveDebugging:
    #   enabled: true

    controller:
      priorityClassName: system-node-critical
    alloy:
      resources:
        requests:
          cpu: 25m
          memory: 100Mi
        limits:
          memory: 256Mi
      extraEnv:
        - name: GOGC
          value: "10"
        - name: GOMEMLIMIT
          valueFrom:
            resourceFieldRef:
              resource: limits.memory

      livenessProbe:
        httpGet:
          path: /metrics
          port: 12345
          scheme: HTTP
        # initialDelaySeconds: 15
        # failureThreshold: 5
        # timeoutSeconds: 5
      # timeoutSeconds: 5 # readiness probe
      enableReporting: false

    configReloader:
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 64Mi
      customArgs:
        - --watched-dir=/etc/alloy
        - --reload-url=http://localhost:12345/-/reload
        # - --reload-timeout=45s
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault

    extraConfig: |-
      loki.source.file "node_logs" {
        file_match {
          enabled = true
        }

        targets    = [
          {__path__ = "/var/log/*.log"},
        ]
        forward_to = [loki.relabel.node_logs.receiver]
      }

      loki.relabel "node_logs" {
        forward_to = [loki.process.static_labels.receiver]

        rule {
          source_labels = ["filename"]
          action = "replace"
          target_label = "job"
          regex = `\/var\/log\/([\w-]+)\.log`
          replacement = "node/$1"
        }
      }

      loki.process "static_labels" {
        stage.static_labels {
            values = {
              node_name = coalesce(sys.env("HOSTNAME"), constants.hostname),
            }
        }

        forward_to = [loki.write.lady_loki.receiver]
      }

      mimir.rules.kubernetes "cluster_rules" {
        address = "http://mimir-mirage:9009"
      }


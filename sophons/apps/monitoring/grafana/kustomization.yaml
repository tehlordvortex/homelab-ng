namespace: monitoring-system
resources:
  - resources.yaml # generated by kustomizer
  - cfdtunnel.yaml
  - httproute.yaml
  - secret.sops.yaml

configMapGenerator:
  - name: grafana-datasources
    options:
      disableNameSuffixHash: true
      labels:
        grafana_datasource: "true"
    files:
      - config/datasources.yaml
  - name: grafana-dashboards
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "true"
    files:
      - victoriametrics-operator.json=https://grafana.com/api/dashboards/17869/revisions/8/download

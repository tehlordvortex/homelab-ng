apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

configMapGenerator:
  - name: litestream-config
    behavior: merge
    files:
      - entrypoint.sh
      - restore-probe.sh
      - litestream.base.yaml

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: litestream-config
      data:
        litestream.yaml: null

resources:
  - secret.sops.yaml
  - certificate.yaml

configMapGenerator:
  - name: litestream-juicefs
    options:
      disableNameSuffixHash: true
      annotations:
        reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
        reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: |
          juicefs-system, victoriametrics-system
    files:
      - litestream.yaml=config/litestream-juicefs.yaml
      - litestream-legacy.yaml=config/litestream-legacy-juicefs.yaml

# ULA subnet: fdf6:9420:fade::/48
machine:
  features:
    diskQuotaSupport: true
  kubelet:
    # if missing, will silently upgrade to talos bundled version :)))))))
    image: ghcr.io/siderolabs/kubelet:v1.36.1
    defaultRuntimeSeccompProfileEnabled: true
    extraArgs:
      image-credential-provider-bin-dir: /usr/local/lib/kubelet/credentialproviders
      image-credential-provider-config: /etc/talos-workaround/kcp.yaml
      feature-gates: MutablePVNodeAffinity=true
      rotate-server-certificates: true
    extraConfig:
      # kubelet serving certs
      serverTLSBootstrap: true
      memorySwap:
        swapBehavior: LimitedSwap
      allowedUnsafeSysctls:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding
    extraMounts:
      - destination: /etc/talos-workaround
        type: bind
        source: /etc/talos-workaround
        options:
          - bind
          - rshared
          - ro
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
      - destination: /var/lib/garage
        type: bind
        source: /var/lib/garage
        options:
          - bind
          - rshared
          - rw
      - destination: /var/lib/local-path-provisioner
        type: bind
        source: /var/lib/local-path-provisioner
        options:
          - bind
          - rshared
          - rw
sops:
  age:

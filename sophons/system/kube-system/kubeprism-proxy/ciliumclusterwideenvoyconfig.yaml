# yaml-language-server: $schema=https://raw.githubusercontent.com/nlamirault/schema-hub/main/schemas/cilium.io/ciliumenvoyconfig_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideEnvoyConfig
metadata:
  name: kubeprism-proxy
  annotations:
    cec.cilium.io/use-original-source-address: "false"
spec:
  resources:
    - "@type": type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: kubeprism
      connect_timeout: 15s
      load_assignment:
        cluster_name: kubeprism
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: 127.0.0.1
                      port_value: 7445

    - "@type": type.googleapis.com/envoy.config.listener.v3.Listener
      name: kubeprism-listener
      address:
        socket_address:
          address: "::"
          port_value: 7446
          ipv4_compat: true
      filter_chains:
        - filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: kubeprism_tcp_proxy
                cluster: kubeprism

# yaml-language-server: $schema=https://raw.githubusercontent.com/nlamirault/schema-hub/main/schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-system-oidc-access
  namespace: flux-system
spec:
  interval: 1m
  wait: true
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: sophons/system/kube-system/oidc-rbac
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nlamirault/schema-hub/main/schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-system-kubeprism-proxy
  namespace: flux-system
spec:
  interval: 1m
  wait: true
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: sophons/system/kube-system/kubeprism-proxy

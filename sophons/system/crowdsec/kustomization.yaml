namespace: crowdsec
resources:
  - resources.yaml # generated by kustomizer
  - bouncer-keys
  - httproute.yaml
  - middleware.yaml
  - ../../apps/garage/access-keys/infinity-and-beyond
components:
  - ../../common/litestream
  - ../../common/litestream/templ-config

secretGenerator:
  - name: crowdsec
    env: .env

patches:
  - target:
      kind: Deployment
      name: crowdsec-lapi
    patch: |-
      - op: replace
        path: /kind
        value: StatefulSet
      - op: remove
        path: /spec/strategy
      - op: add
        path: /spec/template/spec/hostUsers
        value: false

  - target:
      kind: Deployment
      name: crowdsec-agent
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false

  # see middleware.yaml
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: crowdsec-appsec
      spec:
        template:
          spec:
            hostUsers: false
            topologySpreadConstraints:
              - labelSelector:
                  matchLabels:
                    k8s-app: crowdsec
                    type: appsec
                maxSkew: 1
                minDomains: 4
                matchLabelKeys: [pod-template-hash]
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule

  - target:
      kind: Service
      name: crowdsec-appsec-service
    patch: |-
      - op: add
        path: /spec/trafficDistribution
        value: PreferSameZone

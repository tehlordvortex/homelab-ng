namespace: kube-system
namePrefix: klusterscale-
resources:
  - daemonset.yaml
  - podmonitor.yaml
components:
  - ../../common/tailscale
  - ../../common/tailscale/state-path

secretGenerator:
  - name: tailscale-auth
    envs: [.env]

labels:
  - pairs:
      app.kubernetes.io/name: tailscale
      app.kubernetes.io/instance: klusterscale
    includeTemplates: true
    includeSelectors: true

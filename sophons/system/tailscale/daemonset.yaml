# yaml-language-server: $schema=https://github.com/yannh/kubernetes-json-schema/raw/refs/heads/master/v1.35.2/daemonset-apps-v1.json
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tailscale
  namespace: kube-system
spec:
  selector: {}
  template:
    spec:
      priorityClassName: system-node-critical
      tolerations:
        - key: caeneus.sophons.cloud
          operator: Exists
        - key: prime.sophons.cloud
          operator: Exists
        - key: node.cilium.io/agent-not-ready
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/memory-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/pid-pressure
          operator: Exists
          effect: NoSchedule
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule

      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      hostAliases:
        - ip: 10.43.0.69
          hostnames:
            - hs.vrtx.sh
        - ip: 2001:cafe:43::69
          hostnames:
            - hs.vrtx.sh

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      volumes:
        - name: tmp
          emptyDir: {}
        - name: tailscale
          hostPath:
            path: /var/lib/garage/tailscale

      containers:
        - name: tailscale
          image: ghcr.io/tailscale/tailscale

          ports:
            - containerPort: 9002
              name: ts-metrics

          envFrom:
            - configMapRef:
                name: tailscale-config
            - secretRef:
                name: tailscale-auth

          env:
            - name: KUBERNETES_SERVICE_HOST
              value: localhost
            - name: KUBERNETES_SERVICE_PORT
              value: "7445"
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            # https://tailscale.com/blog/kubernetes-direct-connections
            # tailscaled listening port
            - name: PORT
              value: "41641"
            - name: TS_EXTRA_ARGS
              value: $(TS_BASE_ARGS)
            - name: TS_TAILSCALED_EXTRA_ARGS
              value: $(TSD_BASE_ARGS)
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TS_USERSPACE
              value: "false"
            # WARN: WILL break cilium
            # - name: TS_DEBUG_FIREWALL_MODE
            #   value: nftables

          volumeMounts:
            - mountPath: /tmp
              name: tmp
            - mountPath: /run
              name: tmp
              subPath: run
            - mountPath: /var/lib/tailscale
              name: tailscale

          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]

          startupProbe:
            httpGet:
              path: /healthz
              port: ts-metrics
            failureThreshold: 15

          readinessProbe:
            httpGet:
              path: /healthz
              port: ts-metrics

          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
              devic.es/tun: "1"

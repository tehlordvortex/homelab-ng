# yaml-language-server: $schema=https://raw.githubusercontent.com/nlamirault/schema-hub/main/schemas/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-system-node-local-dns
  namespace: flux-system
spec:
  interval: 1m
  wait: true
  prune: false
  sourceRef:
    kind: OCIRepository
    name: flux-system
  path: sophons/system/node-local-dns

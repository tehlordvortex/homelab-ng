resources:
  - resources.yaml # generated by kustomizer
  - service.yaml

patches:
  - patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: cilium
        namespace: kube-system
      spec:
        template:
          spec:
            containers:
              - name: cilium-agent
                env:
                  - name: GOGC
                    value: "25"
                  - name: GOMEMLIMIT
                    value: 350MiB # lower limit for cilium itself inside the container
                    valueFrom: null

# yaml-language-server: $schema=https://github.com/cilium/cilium/raw/refs/tags/v1.20.0-pre.3/install/kubernetes/cilium/values.schema.json
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup

cluster:
  name: sophons

# dashboards:
#   enabled: true
# prometheus:
#   enabled: true
#   serviceMonitor:
#     enabled: true
#     interval: null

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 1Gi # higher limit for bpf compilations and stuff
initResources:
  requests:
    cpu: 10m
    memory: 10Mi
  limits:
    memory: 64Mi

cni:
  customConf: false
  uninstall: false

# gatewayAPI:
#   enableAlpn: true
#   enableAppProtocol: true
#   enabled: true
#   hostNetwork:
#     enabled: true

ipv6:
  enabled: true
ipam:
  mode: kubernetes

k8sServiceHost: localhost
k8sServicePort: 7445

MTU: 1405 # https://github.com/cilium/cilium/pull/45940/changes
routingMode: native
ipv4NativeRoutingCIDR: 10.41.0.0/16
ipv6NativeRoutingCIDR: 2001:cafe:41::/56

kubeProxyReplacement: true
bpfClockProbe: true
bpf:
  masquerade: true
  datapathMode: netkit
  distributedLRU:
    enabled: true
  mapDynamicSizeRatio: "0.00020"
  ctAccounting: true
localRedirectPolicies:
  enabled: true
loadBalancer:
  serviceTopology: true
  acceleration: best-effort
bandwidthManager:
  enabled: true
  bbr: true
hostFirewall:
  enabled: true
pmtuDiscovery:
  enabled: true

envoy:
  enabled: true
  extraEnv:
    - name: GOMEMLIMIT
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
  resources:
    requests:
      memory: 32Mi
    limits:
      memory: 128Mi
  securityContext:
    capabilities:
      keepCapNetBindService: true
      envoy:
        # Used since cilium proxy uses setting IPPROTO_IP/IP_TRANSPARENT
        - NET_ADMIN
        # We need it for now but might not need it for >= 5.11 specially
        # for the 'SYS_RESOURCE'.
        # In >= 5.8 there's already BPF and PERMON capabilities
        # - SYS_ADMIN
        # Both PERFMON and BPF requires kernel 5.8, container runtime
        # cri-o >= v1.22.0 or containerd >= v1.5.0.
        # If available, SYS_ADMIN can be removed.
        - PERFMON
        - BPF
        # Bind to ports < 1023
        - NET_BIND_SERVICE
  # prometheus:
  #   enabled: true
  #   serviceMonitor:
  #     enabled: true
  #     interval: null

hubble:
  ui:
    enabled: true
    # prometheus:
    #   enabled: true
    #   serviceMonitor:
    #     enabled: true
  relay:
    enabled: true
    # prometheus:
    #   enabled: true
    #   serviceMonitor:
    #     enabled: true
  # metrics:
  #   enabled: [drop, tcp, udp, flow, icmp]
  #   dashboards:
  #     enabled: true
  #   serviceMonitor:
  #     enabled: true

operator:
  replicas: 3
  unmanagedPodWatcher:
    restart: true
  dashboards:
    enabled: true
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true

policyEnforcementMode: default
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

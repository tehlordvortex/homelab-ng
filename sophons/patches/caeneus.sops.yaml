---
cluster:
  network:
    cni:
      name: none
machine:
  sysctls:
    # 64MiB
    vm.min_free_kbytes: 65536
    vm.swappiness: 200
    vm.watermark_scale_factor: 100
    kernel.unprivileged_userns_clone: 1
  kubelet:
    extraMounts:
      - destination: /var/lib/garage/backup/big-boi
        type: bind
        source: /var/lib/garage/backup/big-boi
        options:
          - bind
          - rshared
          - rw
      - destination: /var/lib/garage/backup/less-big-boi
        type: bind
        source: /var/lib/garage/backup/less-big-boi
        options:
          - bind
          - rshared
          - rw
      - destination: /mnt/less-big-boi/media
        type: bind
        source: /mnt/less-big-boi/media
        options:
          - bind
          - rshared
          - rw
      - destination: /mnt/big-boi/time-machine
        type: bind
        source: /mnt/big-boi/time-machine
        options:
          - bind
          - rshared
          - rw
      - destination: /mnt/big-boi/everything-else
        type: bind
        source: /mnt/big-boi/everything-else
        options:
          - bind
          - rshared
          - rw
    extraConfig:
      mergeDefaultEvictionSettings: true
      evictionHard:
        nodefs.available: 0%
        nodefs.inodesFree: 0%
      # kubelet doesn't use cgroups to apply limits, so, hacks!
      systemReserved:
        ephemeral-storage: 1.5Ti
        cpu: 18000m
        memory: 80Gi
  features:
    hostDNS:
      enabled: true
      forwardKubeDNSToHost: true
  nodeLabels:
    egress.sophons.cloud/positron: "true"
    topology.kubernetes.io/region: ng
    # TODO: fully merge all of NG into one zone
    topology.kubernetes.io/zone: ng-east-1
    hugeloads.sophons.cloud/longhorn: "false"
    hugeloads.sophons.cloud/postgres: "false"
  network:
    interfaces:
      - interface: eth0
        dhcp: false
        addresses:
          - 10.42.42.5/16
        routes:
          - network: 0.0.0.0/0
            gateway: 10.42.0.1
          - network: ::/0
            gateway: fe80::1

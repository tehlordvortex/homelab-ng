---
cluster:
  network:
    cni:
      name: none
machine:
  install:
    disk: /dev/mmcblk0
  kernel:
    modules:
      - name: snd-usb-audio
  sysctls:
    # 64MiB
    vm.min_free_kbytes: 65536
    vm.swappiness: 200
    vm.watermark_scale_factor: 250
  kubelet:
    extraConfig:
      mergeDefaultEvictionSettings: true
      evictionSoft:
        memory.available: 150Mi
      evictionSoftGracePeriod:
        memory.available: 30s
      evictionHard:
        memory.available: 100Mi
  nodeLabels:
    egress.sophons.cloud/positron: "true"
    topology.kubernetes.io/region: ng
    topology.kubernetes.io/zone: ng-east-2
    hugeloads.sophons.cloud/postgres: "false"
  network:
    interfaces:
      - interface: end0
        dhcp: false
        vlans:
          - vlanId: 42
            dhcp: false
            # dhcp: true
            # dhcpOptions:
            #   ipv4: false
            #   ipv6: true
            addresses:
              - 10.42.42.2/16
            routes:
              - network: 0.0.0.0/0
                gateway: 10.42.0.1

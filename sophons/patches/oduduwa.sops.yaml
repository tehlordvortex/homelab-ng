---
cluster:
  network:
    cni:
      name: none
machine:
  install:
    disk: /dev/sda
  # sysctls:
  #   # 64MiB
  #   vm.min_free_kbytes: 65536
  #   # vm.swappiness: 200
  #   vm.watermark_scale_factor: 50
  kubelet:
    extraConfig:
      mergeDefaultEvictionSettings: true
      evictionSoft:
        memory.available: 256Mi
      evictionSoftGracePeriod:
        memory.available: 15s
      evictionHard:
        memory.available: 100Mi
  nodeLabels:
    topology.kubernetes.io/region: ng
    topology.kubernetes.io/zone: ng-west-1
    hugeloads.sophons.cloud/longhorn: "false"
    hugeloads.sophons.cloud/postgres: "false"
    hugeloads.sophons.cloud/garage: "true"
    cluster.garage.sophons.cloud/global: "true"
    weed.sophons.cloud/cluster: global
    weed.sophons.cloud/volume: "true"
  network:
    interfaces:
      - interface: ens18
        dhcp: false
        # enc!
        addresses:
          - ENC[AES256_GCM,data:ZzCWWAPEOF5MvPQhDsmdU40=,iv:sypbrqznx7BzclPaDw/3PTP1BjCr2nO266YUvfMAzPM=,tag:5KcOsjc17MNKFtwkr08S8g==,type:str]
        routes:
          - network: 0.0.0.0/0
            # enc!
            gateway: ENC[AES256_GCM,data:8FwhZir09powd74uzpI=,iv:4BQ2zXpF2851ZIDr7KDENtY+iY/BW9T+Jolu+/kwxhc=,tag:QbHPtCzYCVUtiXRYz4xKfA==,type:str]
  pods:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: tunnelbroker-configurer
        namespace: kube-system
      spec:
        hostNetwork: true
        containers:
          - name: tunnelbroker
            image: docker.io/library/alpine:3.23.3
            env:
              - name: TUN_IPSUBNET
                # enc!
                value: ENC[AES256_GCM,data:KVdadACVNKcfRBdCCZw+zVY8wklQQw==,iv:96Lwy9vZof7isnIq8BDqEwoi5FW9cqZhq3NrTl6tNfk=,tag:Wf9L20/bYw85hyeCxGWWpg==,type:str]
              - name: REMOTE_IP
                # enc!
                value: ENC[AES256_GCM,data:f/pPT/JQvfbDpCyX5g==,iv:77YRxRK3LyeNyhiJmsZkokJ9ctXjC8i9ZJ5yPS2taqg=,tag:OQLhIQ2j8v2QD97fbPU5gA==,type:str]
              - name: LOCAL_IP
                # enc!
                value: ENC[AES256_GCM,data:Pvc5PFaJhzMBtBaMd8Q=,iv:r6bTqffGXLv0q8/Wr4yPq02Ok2XlxeXkJZd5qnHW+CM=,tag:Tz0JE5drMHONLCUH3Uj3kQ==,type:str]
            command:
              - ash
              - -c
              - |
                set -xeuo pipefail

                if test -z "$(ip tunnel show he-ipv6)"; then
                  ip tunnel add he-ipv6 mode sit remote $REMOTE_IP local $LOCAL_IP ttl 255
                fi
                ip link set he-ipv6 up

                if test -z "$(ip addr show dev he-ipv6 to $TUN_IPSUBNET)"; then
                  ip addr add $TUN_IPSUBNET dev he-ipv6
                fi

                mkfifo /pause
                </pause
            securityContext:
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_ADMIN

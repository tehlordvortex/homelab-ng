cluster:
  network:
    cni:
      name: none
machine:
  install:
    disk: /dev/sda
  # sysctls:
  #   # 64MiB
  #   vm.min_free_kbytes: 65536
  #   # vm.swappiness: 200
  #   vm.watermark_scale_factor: 50
  kubelet:
    extraConfig:
      mergeDefaultEvictionSettings: true
      evictionSoft:
        memory.available: 256Mi
      evictionSoftGracePeriod:
        memory.available: 15s
      evictionHard:
        memory.available: 100Mi
  nodeLabels:
    topology.kubernetes.io/region: ng
    topology.kubernetes.io/zone: ng-west-1
    hugeloads.sophons.cloud/longhorn: "false"
    hugeloads.sophons.cloud/postgres: "false"
    # hugeloads.sophons.cloud/garage: "true"
    # cluster.garage.sophons.cloud/global: "true"
    # weed.sophons.cloud/cluster: global
    # weed.sophons.cloud/volume: "true"
  network:
    interfaces:
      - interface: ens18
        dhcp: false
        # enc!
        addresses:
          - ENC[AES256_GCM,data:9mL12uahEd70IvXG1jaPt4U=,iv:/2idRUtbHtmr2YryYogjlH/0eGCtIXbSjtUP8Wkj6ig=,tag:d/ePjTFlGYqICZVg4X4qMw==,type:str]
        routes:
          - network: 0.0.0.0/0
            # enc!
            gateway: ENC[AES256_GCM,data:xnubSW+xmhAylxztyfQ=,iv:Idc7FvkspgnkhiKsaEfZ/K0n8titn1XSOfnALhxYD7M=,tag:M2QfTzDaATpYHJXUbHH6dA==,type:str]
  pods:
    - apiVersion: v1
      kind: Pod
      metadata:
        name: tunnelbroker-configurer
        namespace: kube-system
      spec:
        hostNetwork: true
        containers:
          - name: tunnelbroker
            image: docker.io/library/alpine:3.23.3
            env:
              - name: TUN_IPSUBNET
                # enc!
                value: ENC[AES256_GCM,data:2hSAPE41jYfaSCBr2DuuKDwl7VGlIA==,iv:PAeNPMxApMw8rpGI5zQFQfkwbch9bVpNGSirq66/LqY=,tag:6xlJXGN0hco6WIKY4ZBZPw==,type:str]
              - name: REMOTE_IP
                # enc!
                value: ENC[AES256_GCM,data:arosk0ZjsLJQetK0rw==,iv:MPdDyoAhdLDlsUujA5UMWLPaenVMdVuI+1+iJDNfBC0=,tag:pOXlM0Je8uxB7LJE13oHzQ==,type:str]
              - name: LOCAL_IP
                # enc!
                value: ENC[AES256_GCM,data:RML8AGWaNdn6vdXORuM=,iv:9FnhgpOiRDEiqjl6cIcM4qzQ1QCo0luJJG7kIvfhOAg=,tag:Umioph8qZQZA3FkOnsrUmg==,type:str]
            command:
              - ash
              - -c
              - |
                set -xeuo pipefail

                if test -z "$(ip tunnel show he-ipv6)"; then
                  ip tunnel add he-ipv6 mode sit remote $REMOTE_IP local $LOCAL_IP ttl 255
                fi
                ip link set he-ipv6 up

                if test -z "$(ip addr show dev he-ipv6 to $TUN_IPSUBNET)"; then
                  ip addr add $TUN_IPSUBNET dev he-ipv6
                fi

                mkfifo /pause
                </pause
            securityContext:
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_ADMIN

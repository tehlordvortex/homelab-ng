# The default expression is too trigger happy and _causes_ issues by shooting
# perfectly fine containers in the head
apiVersion: v1alpha1
kind: OOMConfig
triggerExpression: |
  memory_full_avg60 > 25.0 &&
  d_memory_full_avg60 > 5.0 &&
  time_since_trigger > duration("30s")
cgroupRankingExpression: |
  memory_max.hasValue() ? 0.0 :
  {Besteffort: 1.0, Burstable: 0.15, Guaranteed: 0.0, Podruntime: 0.0, System: 0.0}[class] *
  double(memory_current.orValue(0u))
sampleInterval: 1s

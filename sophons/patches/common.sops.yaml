# ULA subnet: fdf6:9420:fade::/48
cluster:
  network:
    podSubnets:
      - 10.41.0.0/16
      - 2001:cafe:41::/56
    serviceSubnets:
      - 10.43.0.0/16
      - 2001:cafe:43::/112
  proxy:
    disabled: true
machine:
  kernel:
    modules:
      - name: binfmt_misc
  sysctls:
    vm.swappiness: 50
    # # 128MiB
    # vm.min_free_kbytes: 131072
    # 256MiB
    # vm.min_free_kbytes: 262144
    # vm.vfs_cache_pressure: 150
    # vm.watermark_scale_factor: 25
    fs.inotify.max_user_watches: 4194304
    fs.inotify.max_user_instances: 65536
    user.max_user_namespaces: 65536
    net.core.default_qdisc: fq_codel
    net.ipv4.ip_forward: 1
    net.ipv6.conf.all.forwarding: 1
    net.ipv4.tcp_congestion_control: bbr
    # https://github.com/quic-go/quic-go/wiki/UDP-Buffer-Sizes
    net.core.rmem_max: 7500000
    net.core.wmem_max: 7500000
  network:
    # interfaces:
    #   - interface: lo
    #     addresses:
    #       # Workaround to allow CoreDNS to continue to work with hostDNS & BPF masquerading
    #       # https://github.com/siderolabs/talos/pull/9200#issuecomment-2805269653
    #       - 169.254.116.108/32
    kubespan:
      enabled: false
  kubelet:
    nodeIP:
      validSubnets:
        - 10.67.0.0/24
        - fdf6:9420:fade:67::/64
    defaultRuntimeSeccompProfileEnabled: true
    extraArgs:
      feature-gates: MutablePVNodeAffinity=true
      rotate-server-certificates: true
    extraConfig:
      # kubelet serving certs
      serverTLSBootstrap: true
      memorySwap:
        swapBehavior: LimitedSwap
      allowedUnsafeSysctls:
        - net.ipv4.ip_forward
        - net.ipv6.conf.all.forwarding
    extraMounts:
      - destination: /var/lib/longhorn
        type: bind
        source: /var/lib/longhorn
        options:
          - bind
          - rshared
          - rw
      - destination: /var/lib/garage
        type: bind
        source: /var/lib/garage
        options:
          - bind
          - rshared
          - rw
      - destination: /var/lib/local-path-provisioner
        type: bind
        source: /var/lib/local-path-provisioner
        options:
          - bind
          - rshared
          - rw
  features:
    # rbac: true
    # stableHostname: true
    # apidCheckExtKeyUsage: true
    hostDNS:
      # TODO: why randomly brokey sigh
      enabled: true
      forwardKubeDNSToHost: true
      resolveMemberNames: true
  nodeLabels:
    sophons.cloud/fayawall: "true"
    hugeloads.sophons.cloud/longhorn: "true"
    hugeloads.sophons.cloud/postgres: "true"
